services:
  postgres:
    image: nexus.gillouche.homelab/docker-hub/library/postgres:18.3-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: playground
      POSTGRES_PASSWORD: playground
      POSTGRES_DB: playground
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./keycloak/init-keycloak-db.sh:/docker-entrypoint-initdb.d/02-init-keycloak.sh:ro

  redis:
    image: nexus.gillouche.homelab/docker-hub/library/redis:8-alpine
    ports:
      - "6379:6379"
    command: redis-server --requirepass playground

  kafka:
    image: nexus.gillouche.homelab/docker-hub/apache/kafka:latest
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: sandbox-kafka

  mongodb:
    image: nexus.gillouche.homelab/docker-hub/library/mongo:8
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: playground
      MONGO_INITDB_ROOT_PASSWORD: playground
    volumes:
      - mongodb-data:/data/db

  keycloak:
    image: nexus.gillouche.homelab/docker-hub/keycloak/keycloak:26.2
    ports:
      - "8180:8080"
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: playground
      KC_DB_PASSWORD: playground
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    command: start-dev --import-realm
    volumes:
      - ./keycloak/api-lab-realm.json:/opt/keycloak/data/import/api-lab-realm.json:ro
    depends_on:
      - postgres

  jaeger:
    image: nexus.gillouche.homelab/docker-hub/jaegertracing/all-in-one:latest
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

volumes:
  postgres-data:
  mongodb-data:
