# Pre-commit hooks for polyglot monorepo
# Uses upstream hooks for tool installation and auto-fixing
#
# Install: pre-commit install
# Run all: pre-commit run --all-files
#
# Note: Requires language runtimes (python, node, go, cargo) to be available in shell

repos:
  # =============================================================================
  # General
  # =============================================================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
        exclude: \.ytt\.yaml$
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: detect-private-key

  # =============================================================================
  # Python - Ruff & Mypy
  # =============================================================================
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.4
    hooks:
      - id: ruff
        name: ruff (lint)
        args: [--fix, --exit-non-zero-on-fix]
        types: [python]
        files: ^apps/.*\.py$

      - id: ruff-format
        name: ruff (format)
        types: [python]
        files: ^apps/.*\.py$

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.1
    hooks:
      - id: mypy
        name: mypy (greeting-service)
        args: [--ignore-missing-imports]
        additional_dependencies: [types-requests, types-PyYAML]
        files: ^apps/demo-app/greeting-service/.*\.py$
      - id: mypy
        name: mypy (infra-check-service)
        args: [--ignore-missing-imports]
        additional_dependencies: [types-requests, types-PyYAML, types-redis]
        files: ^apps/demo-app/infra-check-service/.*\.py$
      - id: mypy
        name: mypy (traffic-generator-service)
        args: [--ignore-missing-imports]
        additional_dependencies: [types-requests, types-PyYAML]
        files: ^apps/demo-app/traffic-generator-service/.*\.py$

  # =============================================================================
  # Go - GolangCI-Lint & Go Imports
  # =============================================================================
  - repo: https://github.com/dnephin/pre-commit-golang
    rev: v0.5.1
    hooks:
      - id: go-fmt
        name: gofmt
        files: ^apps/.*\.go$
      - id: go-imports
        name: goimports
        files: ^apps/.*\.go$
      - id: go-unit-tests
        name: go test
        files: ^apps/.*\.go$
        # entry: bash -c 'cd "$(dirname "$1")" && go test ./...' (implied)

  - repo: https://github.com/golangci/golangci-lint
    rev: v1.63.4
    hooks:
      - id: golangci-lint
        name: golangci-lint
        files: ^apps/.*\.go$

  # =============================================================================
  # Rust - Cargo
  # =============================================================================
  - repo: https://github.com/backplane/pre-commit-rust-hooks
    rev: v1.2.1
    hooks:
      - id: fmt
        name: rustfmt
        files: ^apps/.*\.rs$
      - id: clippy
        name: clippy
        args: ["--", "-D", "warnings"]
        files: ^apps/.*\.rs$

  # =============================================================================
  # TypeScript / JavaScript - Prettier
  # =============================================================================
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        name: prettier
        # Default entry is prettier --write
        files: ^apps/.*\.(ts|tsx|js|jsx|json|md)$
        exclude: (\.lock\.|lock\.json|pnpm-lock)

  # =============================================================================
  # Bazel / Starlark - Buildifier
  # =============================================================================
  - repo: https://github.com/keith/pre-commit-buildifier
    rev: 7.3.1
    hooks:
      - id: buildifier
        name: buildifier (format)
        files: (BUILD\.bazel|BUILD|WORKSPACE|\.bzl)$

  # =============================================================================
  # Shell - Shellcheck
  # =============================================================================
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        name: shellcheck
        types: [shell]

  # =============================================================================
  # YAML - Yamllint
  # =============================================================================
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        name: yamllint
        args: [-c, .yamllint.yaml]
        files: \.(yaml|yml)$
        exclude: (pnpm-lock|\.ytt\.)
