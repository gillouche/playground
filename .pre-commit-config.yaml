# Pre-commit hooks for polyglot monorepo
# Uses upstream hooks for tool installation and auto-fixing
#
# Install: pre-commit install
# Run all: pre-commit run --all-files
#
# Note: Requires language runtimes (python, node, go, cargo) to be available in shell

repos:
  # =============================================================================
  # General
  # =============================================================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
        exclude: \.ytt\.yaml$
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: detect-private-key

  # =============================================================================
  # Python - Ruff & Mypy
  # =============================================================================
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.4
    hooks:
      - id: ruff
        name: ruff (lint)
        args: [--fix, --exit-non-zero-on-fix]
        types: [python]
        files: ^(apps|tools)/.*\.py$
        exclude: /generated/

      - id: ruff-format
        name: ruff (format)
        types: [python]
        files: ^(apps|tools)/.*\.py$
        exclude: /generated/

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.1
    hooks:
      - id: mypy
        name: mypy (greeting-service)
        args: [--ignore-missing-imports]
        additional_dependencies: [types-requests, types-PyYAML]
        files: ^apps/demo-app/greeting-service/.*\.py$
      - id: mypy
        name: mypy (infra-check-service)
        args: [--ignore-missing-imports]
        additional_dependencies: [types-requests, types-PyYAML, types-redis]
        files: ^apps/demo-app/infra-check-service/.*\.py$
      - id: mypy
        name: mypy (traffic-generator-service)
        args: [--ignore-missing-imports]
        additional_dependencies: [types-requests, types-PyYAML]
        files: ^apps/demo-app/traffic-generator-service/.*\.py$
      - id: mypy
        name: mypy (api-lab/python-common)
        args: [--ignore-missing-imports]
        additional_dependencies: [types-requests, types-PyYAML, types-redis]
        files: ^apps/api-lab/python-common/.*\.py$
      - id: mypy
        name: mypy (api-lab/python-rest-api)
        args: [--ignore-missing-imports]
        additional_dependencies: [types-requests, types-PyYAML, types-redis]
        files: ^apps/api-lab/python-rest-api/.*\.py$
      - id: mypy
        name: mypy (api-lab/python-grpc-api)
        args: [--ignore-missing-imports]
        additional_dependencies: [types-requests, types-PyYAML, types-redis]
        files: ^apps/api-lab/python-grpc-api/.*\.py$
      - id: mypy
        name: mypy (api-lab/graphql-gateway)
        args: [--ignore-missing-imports]
        additional_dependencies: [types-requests, types-PyYAML, types-redis]
        files: ^apps/api-lab/graphql-gateway/.*\.py$

  # =============================================================================
  # Go - GolangCI-Lint & Go Imports
  # =============================================================================
  - repo: https://github.com/dnephin/pre-commit-golang
    rev: v0.5.1
    hooks:
      - id: go-fmt
        name: gofmt
        files: ^apps/.*\.go$
      - id: go-imports
        name: goimports
        files: ^apps/.*\.go$

  - repo: local
    hooks:
      - id: go-unit-tests
        name: go test
        language: system
        entry: bash -c 'for mod in $(find apps -name go.mod -exec dirname {} \;); do echo "Testing $mod..." && (cd "$mod" && go test ./...); done'
        files: ^apps/.*\.go$
        pass_filenames: false
      - id: golangci-lint
        name: golangci-lint
        language: system
        entry: bash -c 'for mod in $(find apps -name go.mod -exec dirname {} \;); do echo "Linting $mod..." && (cd "$mod" && golangci-lint run ./...); done'
        files: ^apps/.*\.go$
        pass_filenames: false

  # =============================================================================
  # Rust - Cargo
  # =============================================================================
  - repo: local
    hooks:
      - id: rustfmt
        name: rustfmt
        language: system
        entry: bash -c 'for manifest in $(find apps -name Cargo.toml -exec dirname {} \;); do echo "Formatting $manifest..." && (cd "$manifest" && cargo fmt --check); done'
        files: ^apps/.*\.rs$
        pass_filenames: false
      - id: clippy
        name: clippy
        language: system
        entry: bash -c 'for manifest in $(find apps -name Cargo.toml -exec dirname {} \;); do echo "Linting $manifest..." && (cd "$manifest" && cargo clippy -- -D warnings); done'
        files: ^apps/.*\.rs$
        pass_filenames: false

  # =============================================================================
  # TypeScript / JavaScript - Prettier
  # =============================================================================
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        name: prettier
        # Default entry is prettier --write
        files: ^apps/.*\.(ts|tsx|js|jsx|json|md)$
        exclude: (\.lock\.|lock\.json|pnpm-lock)

  # =============================================================================
  # Bazel / Starlark - Buildifier
  # =============================================================================
  - repo: https://github.com/keith/pre-commit-buildifier
    rev: 7.3.1
    hooks:
      - id: buildifier
        name: buildifier (format)
        files: (BUILD\.bazel|BUILD|WORKSPACE|\.bzl)$

  # =============================================================================
  # Shell - Shellcheck
  # =============================================================================
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        name: shellcheck
        types: [shell]

  # =============================================================================
  # YAML - Yamllint
  # =============================================================================
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        name: yamllint
        args: [-c, .yamllint.yaml]
        files: \.(yaml|yml)$
        exclude: (pnpm-lock|\.ytt\.)
