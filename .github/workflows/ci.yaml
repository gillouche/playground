name: Build & Test

on:
  push:
    branches: ['**']
    tags-ignore:
      - '**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: none
  actions: none
  id-token: none

jobs:
  security-check:
    name: Security Check
    runs-on: ubuntu-latest
    if: github.repository_owner == 'gillouche'
    outputs:
      is_safe: ${{ steps.gate.outputs.is_safe }}
    steps:
      - uses: actions/checkout@v4
      - uses: gillouche/homelab-ci/actions/security-gate@main
        id: gate

  discover-services:
    name: Discover Services
    needs: security-check
    if: needs.security-check.outputs.is_safe == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.services.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Find all services
        id: services
        run: |
          SERVICES=$(find apps -mindepth 3 -maxdepth 3 -type f -name BUILD.bazel | while read -r f; do
            dir=$(dirname "$f")
            app=$(basename "$(dirname "$dir")")
            service=$(basename "$dir")
            jq -n -c --arg app "$app" --arg service "$service" '{app: $app, service: $service}'
          done | jq -sc '.')
          echo "matrix=$SERVICES" >> "$GITHUB_OUTPUT"
          echo "Found services: $SERVICES"

  build-and-test:
    name: ${{ matrix.service.app }}/${{ matrix.service.service }}
    needs: [security-check, discover-services]
    if: needs.security-check.outputs.is_safe == 'true' && needs.discover-services.outputs.matrix != '[]'
    runs-on: playground-runner
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.discover-services.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Nix Cache Profile
        uses: gillouche/homelab-ci/actions/setup-aws-profile@main
        with:
          profile: nix
          access-key-id: ${{ secrets.NIX_CACHE_ACCESS_KEY }}
          secret-access-key: ${{ secrets.NIX_CACHE_SECRET_KEY }}

      - name: Setup Nix Environment
        uses: gillouche/homelab-ci/actions/setup-nix-env@main

      - name: Login to Nexus registry
        run: |
          { set +x; } 2>/dev/null
          echo "${{ secrets.NEXUS_PASSWORD }}" | docker login nexus.gillouche.homelab \
            -u "${{ secrets.NEXUS_USERNAME }}" \
            --password-stdin

      - name: Build
        run: |
          { set +x; } 2>/dev/null
          nix develop ./nix#ci --command bazel \
            build --config=ci //apps/${{ matrix.service.app }}/${{ matrix.service.service }}/...

      - name: Test
        run: |
          { set +x; } 2>/dev/null
          nix develop ./nix#ci --command bazel \
            test --config=ci //apps/${{ matrix.service.app }}/${{ matrix.service.service }}/...

  push-images:
    name: Push Images
    needs: [security-check, build-and-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.security-check.outputs.is_safe == 'true'
    runs-on: playground-runner
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Nix Cache Profile
        uses: gillouche/homelab-ci/actions/setup-aws-profile@main
        with:
          profile: nix
          access-key-id: ${{ secrets.NIX_CACHE_ACCESS_KEY }}
          secret-access-key: ${{ secrets.NIX_CACHE_SECRET_KEY }}

      - name: Setup Nix Environment
        uses: gillouche/homelab-ci/actions/setup-nix-env@main

      - name: Login to Nexus registry
        run: |
          { set +x; } 2>/dev/null
          echo "${{ secrets.NEXUS_PASSWORD }}" | docker login nexus.gillouche.homelab \
            -u "${{ secrets.NEXUS_USERNAME }}" \
            --password-stdin

      - name: Smart push images
        run: |
          { set +x; } 2>/dev/null
          SHORT_SHA=$(echo $GITHUB_SHA | cut -c1-7)
          echo "Smart pushing ARM64 images (only if changed)..."

          nix develop ./nix#ci --command python3 tools/ci/smart_push.py --tag latest --tag $SHORT_SHA
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
          DISCORD_WEBHOOK_SECURITY_NOTIFICATIONS: ${{ secrets.DISCORD_WEBHOOK_SECURITY }}

      - name: Push to Nix Cache
        run: |
          { set +x; } 2>/dev/null
          echo "Pushing build artifacts to Nix Cache..."
          nix copy --to "s3://nix-cache?endpoint=http://seaweedfs-s3.seaweedfs.svc.cluster.local:8333&scheme=http&profile=nix" \
            ./nix#ci

  notify:
    name: Notify
    needs: [security-check, build-and-test, push-images]
    if: always() && needs.security-check.outputs.is_safe == 'true'
    runs-on: playground-runner
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Send Success Notification
        if: needs.build-and-test.result == 'success' && (needs.push-images.result == 'success' || needs.push-images.result == 'skipped')
        uses: gillouche/homelab-ci/actions/discord-notify@main
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_GITHUB_ACTIONS }}
          status: success
          title: CI Pipeline
          message: "Build completed successfully for commit ${{ github.sha }}"

      - name: Send Failure Notification
        if: needs.build-and-test.result != 'success' || (needs.push-images.result != 'success' && needs.push-images.result != 'skipped')
        uses: gillouche/homelab-ci/actions/discord-notify@main
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_GITHUB_ACTIONS }}
          status: failure
          title: CI Pipeline
          message: "Build failed for commit ${{ github.sha }}"
