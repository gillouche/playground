name: Playground - CI/CD pipelines

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: none
  actions: none
  id-token: none

env:
  IS_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}

jobs:
  build-and-test:
    name: Build & Test

    if: >
      github.event_name == 'push' ||
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.head.repo.fork == false
      )

    runs-on: playground-runner
    timeout-minutes: 30

    env:
      PLAYGROUND_ROOT: ${{ github.workspace }}

    steps:
      - name: Abort immediately if fork detected
        if: env.IS_FORK == 'true'
        run: |
          echo "Fork PR detected - refusing to run on self-hosted runner"
          exit 1

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Build
        run: |
          # Load Nix environment which provides bazelisk
          # Explicitly use the ci shell from nix/flake.nix
          nix develop ./nix#ci --command bazelisk build //...

      - name: Lint
        run: |
          # Find all lint targets and run them
          nix develop ./nix#ci --command bash -c "bazelisk query 'attr(tags, lint, //...)' | xargs -r -n 1 bazelisk run"

      - name: Test
        run: |
          # Find all test targets (sh_binary with test tag) and run them
          nix develop ./nix#ci --command bash -c "bazelisk query 'attr(tags, test, //...)' | xargs -r -n 1 bazelisk run"

  package-and-push:
    name: Package & Push (main only)

    needs: build-and-test

    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    runs-on: playground-runner
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Load Secrets from Runner Env
        run: |
          echo "NEXUS_USERNAME=$NEXUS_USERNAME" >> $GITHUB_ENV
          echo "NEXUS_PASSWORD=$NEXUS_PASSWORD" >> $GITHUB_ENV

      - name: Login to Nexus
        uses: docker/login-action@v3
        with:
          registry: nexus.gillouche.homelab
          username: ${{ env.NEXUS_USERNAME }}
          password: ${{ env.NEXUS_PASSWORD }}

      - name: Push container images
        run: |
          export DOCKER_CONFIG="$HOME/.docker"
          # Find all oci_push targets and run them
          nix develop ./nix#ci --command bash -c "bazelisk query 'kind(oci_push, //...)' | xargs -r -n 1 -I {} bash -c 'echo \"Pushing {}...\" && bazelisk run {}'"

      - name: Retag images as :latest
        run: |
          # Extract git sha for tagging
          GIT_SHA=$(git rev-parse --short HEAD)
          
          # Find all concepts and apps
          for CONCEPT_DIR in apps/*/; do
            CONCEPT=$(basename "$CONCEPT_DIR")
            
            for APP_DIR in "$CONCEPT_DIR"*/; do
              # Skip if it's deploy or other non-app directories
              if [[ ! -d "$APP_DIR/src" ]]; then
                continue
              fi
              
              APP=$(basename "$APP_DIR")
              IMAGE_BASE="nexus.gillouche.homelab/docker-hosted/$CONCEPT/$APP"
              
              echo "Retagging $IMAGE_BASE:git-$GIT_SHA to $IMAGE_BASE:latest"
              
              # Use skopeo to copy the git-tagged image to latest tag
              nix develop ./nix#ci --command skopeo copy \
                "docker://$IMAGE_BASE:git-$GIT_SHA" \
                "docker://$IMAGE_BASE:latest"
            done
          done

