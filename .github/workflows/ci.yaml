name: Build & Test

on:
  push:
    branches: ['**']
    tags-ignore:
      - '**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: none
  actions: none
  id-token: none

jobs:
  # Security gate for self-hosted runners
  security-check:
    name: Security Check
    runs-on: ubuntu-latest
    if: github.repository_owner == 'gillouche'
    outputs:
      is_safe: ${{ steps.check.outputs.is_safe }}
    steps:
      - name: Verify repository ownership
        id: check
        run: |
          # Block forks from running on self-hosted runners
          if [[ "${{ github.event_name }}" == "pull_request" && "${{ github.event.pull_request.head.repo.fork }}" == "true" ]]; then
            echo "::error::Fork PRs cannot run on self-hosted runners"
            echo "is_safe=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          if [[ "${{ github.repository }}" != "gillouche/playground" ]]; then
            echo "::error::Repository mismatch - blocking execution"
            echo "is_safe=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          echo "is_safe=true" >> "$GITHUB_OUTPUT"

  build-and-test:
    name: Build & Test
    needs: security-check
    if: github.repository_owner == 'gillouche' && needs.security-check.outputs.is_safe == 'true'
    runs-on: playground-runner
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Nix Environment
        uses: ./.github/actions/setup-nix-env

      - name: Send Start Notification
        run: |
          ./tools/ci/notify_discord.sh START "CI Pipeline" "Build started for commit $GITHUB_SHA"

      - name: Build all applications
        run: |
          nix develop \
            --extra-substituters "s3://nix-cache?endpoint=http://seaweedfs-s3.seaweedfs.svc.cluster.local:8333&scheme=http" \
            --extra-trusted-public-keys "cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=" \
            ./nix#ci --command bazel build --config=ci //apps/...

      - name: Run all tests
        run: |
          nix develop \
            --extra-substituters "s3://nix-cache?endpoint=http://seaweedfs-s3.seaweedfs.svc.cluster.local:8333&scheme=http" \
            --extra-trusted-public-keys "cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=" \
            ./nix#ci --command bazel test --config=ci //apps/...

      - name: Smart push images (Main Only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "$NEXUS_PASSWORD" | docker login nexus.gillouche.homelab -u "$NEXUS_USERNAME" --password-stdin

          SHORT_SHA=$(echo $GITHUB_SHA | cut -c1-7)
          echo "Smart pushing ARM64 images (only if changed)..."

          nix develop \
            --extra-substituters "s3://nix-cache?endpoint=http://seaweedfs-s3.seaweedfs.svc.cluster.local:8333&scheme=http" \
            --extra-trusted-public-keys "cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=" \
            ./nix#ci --command python3 tools/ci/smart_push.py --tag latest --tag $SHORT_SHA

      - name: Push to Nix Cache (Main Only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "Pushing build artifacts to Nix Cache..."
          export AWS_ACCESS_KEY_ID=$NIX_ACCESS_KEY_ID
          export AWS_SECRET_ACCESS_KEY=$NIX_SECRET_ACCESS_KEY
          nix copy --to "s3://nix-cache?endpoint=http://seaweedfs-s3.seaweedfs.svc.cluster.local:8333&scheme=http" ./nix#ci

      - name: Send Success Notification
        if: success()
        run: |
          ./tools/ci/notify_discord.sh SUCCESS "CI Pipeline" "Build completed successfully for commit $GITHUB_SHA"

      - name: Send Failure Notification
        if: failure()
        run: |
          ./tools/ci/notify_discord.sh FAILURE "CI Pipeline" "Build failed for commit $GITHUB_SHA"
