name: Build & Test

on:
  push:
    branches: [ main ]
    tags-ignore:
      - '**'
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: none
  actions: none
  id-token: none

env:
  IS_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}

jobs:
  analyze:
    name: Analyze Changes
    runs-on: playground-runner
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      has_changes: ${{ steps.matrix.outputs.has_changes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine affected services
        id: matrix
        run: |
          echo "Determining affected targets..."
          # Capture stderr to log, stdout to variable (but bazel outputs to stderr mostly)
          # We need to capture the AFFECTED_* lines
          OUTPUT=$(nix develop ./nix#ci --command bazelisk run //tools:affected_targets 2>&1 | tee /dev/stderr)

          BUILD_TARGETS=$(echo "$OUTPUT" | grep "^AFFECTED_BUILD_TARGETS=" | cut -d= -f2-)
          UNIT_TARGETS=$(echo "$OUTPUT" | grep "^AFFECTED_UNIT_TARGETS=" | cut -d= -f2-)
          LINT_TARGETS=$(echo "$OUTPUT" | grep "^AFFECTED_LINT_TARGETS=" | cut -d= -f2-)
          INTEGRATION_TARGETS=$(echo "$OUTPUT" | grep "^AFFECTED_INTEGRATION_TARGETS=" | cut -d= -f2-)

          # Combine all targets to find all affected services
          ALL_TARGETS="$BUILD_TARGETS $UNIT_TARGETS $LINT_TARGETS $INTEGRATION_TARGETS"

          if [ -z "$(echo $ALL_TARGETS | tr -d ' ')" ]; then
            echo "No affected targets found."
            echo "matrix=[]" >> "$GITHUB_OUTPUT"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "Generating matrix from targets..."
            echo "$ALL_TARGETS" | nix develop ./nix#ci --command bazelisk run //tools/scripts/python:generate_matrix > matrix.json
            MATRIX=$(cat matrix.json)
            echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
            if [ "$MATRIX" == "[]" ]; then
               echo "has_changes=false" >> "$GITHUB_OUTPUT"
            else
               echo "has_changes=true" >> "$GITHUB_OUTPUT"
            fi
            echo "Generated matrix: $MATRIX"
          fi

  validate-service:
    name: ${{ matrix.service.name }}
    needs: analyze
    if: needs.analyze.outputs.has_changes == 'true'
    runs-on: playground-runner
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.analyze.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Load SeaweedFS credentials
        run: |
          echo "AWS_ACCESS_KEY_ID=$SEAWEEDFS_ACCESS_KEY" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=$SEAWEEDFS_SECRET_KEY" >> $GITHUB_ENV

      - name: Send Start Notification
        run: |
          ./tools/scripts/shell/notify_discord.sh START "${{ matrix.service.name }}" "Pipeline started for commit $GITHUB_SHA"

      - name: Build Image
        run: |
          echo "Building image for ${{ matrix.service.name }}..."
          nix develop ./nix#ci --command bazelisk build --config=ci //${{ matrix.service.path }}:image

      - name: Unit Tests
        run: |
          echo "Running unit tests for ${{ matrix.service.name }}..."
          # Find unit test targets under the service path
          TARGETS=$(nix develop ./nix#ci --command bazelisk query "attr(tags, unit, //${{ matrix.service.path }}/...)" 2>/dev/null || true)
          if [ -n "$TARGETS" ]; then
            for target in $TARGETS; do
              echo ">>> Running $target"
              nix develop ./nix#ci --command bazelisk run "$target"
            done
          else
             echo "No unit tests found."
          fi

      - name: Lint
        run: |
          echo "Running lint for ${{ matrix.service.name }}..."
          TARGETS=$(nix develop ./nix#ci --command bazelisk query "attr(tags, lint, //${{ matrix.service.path }}/...)" 2>/dev/null || true)
          if [ -n "$TARGETS" ]; then
            for target in $TARGETS; do
              echo ">>> Running $target"
              nix develop ./nix#ci --command bazelisk run "$target"
            done
          else
             echo "No lint targets found."
          fi

      - name: Integration Tests
        run: |
          echo "Running integration tests for ${{ matrix.service.name }}..."
          TARGETS=$(nix develop ./nix#ci --command bazelisk query "attr(tags, integration, //${{ matrix.service.path }}/...)" 2>/dev/null || true)
          if [ -n "$TARGETS" ]; then
            for target in $TARGETS; do
              echo ">>> Running $target"
              nix develop ./nix#ci --command bazelisk run "$target"
            done
          else
             echo "No integration tests found."
          fi

      - name: Push Image (Main Only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          # Login to Nexus
          echo "$NEXUS_PASSWORD" | docker login nexus.gillouche.homelab -u "$NEXUS_USERNAME" --password-stdin
          
          echo "Pushing image for ${{ matrix.service.name }}..."
          nix develop ./nix#ci --command bazelisk run //${{ matrix.service.path }}:push_oci -- --tag latest --tag $GITHUB_SHA

      - name: Send Success Notification
        if: success()
        run: |
          ./tools/scripts/shell/notify_discord.sh SUCCESS "${{ matrix.service.name }}" "Pipeline completed successfully."

      - name: Send Failure Notification
        if: failure()
        run: |
          ./tools/scripts/shell/notify_discord.sh FAILURE "${{ matrix.service.name }}" "Pipeline failed."
