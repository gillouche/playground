name: Build & Test

on:
  push:
    branches: [ '**' ]
    tags-ignore:
      - '**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      force_all:
        description: 'Force build all services'
        required: false
        default: 'true'

permissions:
  contents: read
  packages: none
  actions: none
  id-token: none

env:
  UV_CACHE_DIR: /home/runner/.cache/uv
  TRIVY_CACHE_DIR: /home/runner/.cache/trivy

jobs:
  # Security gate for self-hosted runners
  security-check:
    name: Security Check
    runs-on: ubuntu-latest
    outputs:
      is_safe: ${{ steps.check.outputs.is_safe }}
    steps:
      - name: Verify repository ownership
        id: check
        run: |
          # Block forks from running on self-hosted runners
          if [[ "${{ github.event_name }}" == "pull_request" && "${{ github.event.pull_request.head.repo.fork }}" == "true" ]]; then
            echo "::error::Fork PRs cannot run on self-hosted runners"
            echo "is_safe=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          if [[ "${{ github.repository }}" != "gillouche/playground" ]]; then
            echo "::error::Repository mismatch - blocking execution"
            echo "is_safe=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          echo "is_safe=true" >> "$GITHUB_OUTPUT"

  analyze:
    name: Analyze Changes
    needs: security-check
    if: needs.security-check.outputs.is_safe == 'true'
    runs-on: playground-runner
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      has_changes: ${{ steps.matrix.outputs.has_changes }}
      formatted_list: ${{ steps.matrix.outputs.formatted_list }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Nix Environment
        uses: ./.github/actions/setup-nix-env

      - name: Determine affected services
        id: matrix
        run: |
          echo "Determining affected targets..."
          # Capture stderr to log, stdout to variable (but bazel outputs to stderr mostly)
          # We need to capture the AFFECTED_* lines
          # Explicitly pass cache settings as existing install config might be stale
          OUTPUT=$(nix develop \
            --extra-substituters "s3://nix-cache?endpoint=http://seaweedfs-s3.seaweedfs.svc.cluster.local:8333&scheme=http" \
            --extra-trusted-public-keys "cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=" \
            ./nix#ci --command bazel run //tools:affected_targets 2>&1 | tee /dev/stderr)

          BUILD_TARGETS=$(echo "$OUTPUT" | grep "^AFFECTED_BUILD_TARGETS=" | cut -d= -f2-)
          UNIT_TARGETS=$(echo "$OUTPUT" | grep "^AFFECTED_UNIT_TARGETS=" | cut -d= -f2-)
          LINT_TARGETS=$(echo "$OUTPUT" | grep "^AFFECTED_LINT_TARGETS=" | cut -d= -f2-)
          INTEGRATION_TARGETS=$(echo "$OUTPUT" | grep "^AFFECTED_INTEGRATION_TARGETS=" | cut -d= -f2-)

          # Combine all targets to find all affected services
          # Check for force_all input
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.force_all }}" == "true" ]]; then
            echo "Forcing build of all services..."
            # Query all application targets (heuristic: all targets under apps/ having build tags or similar)
            # Actually, using bazelisk query to find all 'application' rule targets would be best, but we don't have that rule easily queryable by name.
            # Fallback: Query all targets under apps/ that have a 'push_oci' or 'build_docker' target?
            # Let's assume //apps/... is sufficient, but we need to filter to just the service roots.
            # generate_matrix.py expects targets like //apps/demo-app/greeting-service:something
            
            # Simple approach: query all targets in apps
            ALL_TARGETS=$(nix develop \
              --extra-substituters "s3://nix-cache?endpoint=http://seaweedfs-s3.seaweedfs.svc.cluster.local:8333&scheme=http" \
              --extra-trusted-public-keys "cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=" \
              ./nix#ci --command bazel query "kind(rule, //apps/...)")
          else
             ALL_TARGETS="$BUILD_TARGETS $UNIT_TARGETS $LINT_TARGETS $INTEGRATION_TARGETS"
          fi

          if [ -z "$(echo $ALL_TARGETS | tr -d ' ')" ]; then
            echo "No affected targets found."
            echo "matrix=[]" >> "$GITHUB_OUTPUT"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "Generating matrix from targets..."
            # nix develop prints setup logs to stdout, so we must filter for the JSON line (starts with [)
            echo "$ALL_TARGETS" | nix develop \
              --extra-substituters "s3://nix-cache?endpoint=http://seaweedfs-s3.seaweedfs.svc.cluster.local:8333&scheme=http" \
              --extra-trusted-public-keys "cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=" \
              ./nix#ci --command bazel run //tools/ci:generate_matrix | grep "^\\[" > matrix.json
            MATRIX=$(cat matrix.json)
            echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
            if [ "$MATRIX" == "[]" ]; then
               echo "has_changes=false" >> "$GITHUB_OUTPUT"
            else
               echo "has_changes=true" >> "$GITHUB_OUTPUT"
            fi
            echo "Generated matrix: $MATRIX"

            # Generate formatted list for notification (escaped newlines for JSON)
            FORMATTED_LIST=$(echo "$MATRIX" | jq -r 'if length > 0 then (map("- " + .name) | join("\\n")) else "None" end')
            echo "formatted_list=$FORMATTED_LIST" >> "$GITHUB_OUTPUT"
          fi

      - name: Send Start Notification
        if: steps.matrix.outputs.has_changes == 'true'
        run: |
          ./tools/ci/notify_discord.sh START "CI Pipeline" "Build started for commit $GITHUB_SHA. Affected services:\n${{ steps.matrix.outputs.formatted_list }}"

  validate-service:
    name: ${{ matrix.service.name }}
    needs: analyze
    if: needs.analyze.outputs.has_changes == 'true'
    runs-on: playground-runner
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.analyze.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1  # Only need current commit for build (analyze job handles history)
          persist-credentials: false

      - name: Setup Nix Environment
        uses: ./.github/actions/setup-nix-env

      - name: Load Credentials
        run: |
          # Nexus Registry
          echo "NEXUS_USERNAME=$NEXUS_USERNAME" >> $GITHUB_ENV
          echo "NEXUS_PASSWORD=$NEXUS_PASSWORD" >> $GITHUB_ENV

      - name: Build, Test, and Lint
        run: |
          nix develop \
            --extra-substituters "s3://nix-cache?endpoint=http://seaweedfs-s3.seaweedfs.svc.cluster.local:8333&scheme=http" \
            --extra-trusted-public-keys "cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=" \
            ./nix#ci --command bash -c '
            set -e

            echo "Building image for ${{ matrix.service.name }}..."
            bazel run --config=ci //${{ matrix.service.path }}:build_docker

            echo "Running lint for ${{ matrix.service.name }}..."
            bazel run //${{ matrix.service.path }}:lint

            echo "Running unit tests for ${{ matrix.service.name }}..."
            if bazel query //${{ matrix.service.path }}:unit_test &>/dev/null; then
              bazel run //${{ matrix.service.path }}:unit_test
            else
              echo "No unit tests defined for this service."
            fi

            echo "Running integration tests for ${{ matrix.service.name }}..."
            if bazel query //${{ matrix.service.path }}:integration_test &>/dev/null; then
              bazel run //${{ matrix.service.path }}:integration_test
            else
              echo "No integration tests defined for this service."
            fi
          '

      - name: Push Image (Main Only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          # Login to Nexus
          echo "$NEXUS_PASSWORD" | docker login nexus.gillouche.homelab -u "$NEXUS_USERNAME" --password-stdin
          
          SHORT_SHA=$(echo $GITHUB_SHA | cut -c1-7)
          echo "Pushing image for ${{ matrix.service.name }} with tag $SHORT_SHA..."
          nix develop \
            --extra-substituters "s3://nix-cache?endpoint=http://seaweedfs-s3.seaweedfs.svc.cluster.local:8333&scheme=http" \
            --extra-trusted-public-keys "cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=" \
            ./nix#ci --command bazel run //${{ matrix.service.path }}:push_oci -- --tag latest --tag $SHORT_SHA
          
          echo "Pushing build artifacts to Nix Cache..."
          # Copy current closure to S3 cache
          export AWS_ACCESS_KEY_ID=$NIX_ACCESS_KEY_ID
          export AWS_SECRET_ACCESS_KEY=$NIX_SECRET_ACCESS_KEY
          nix copy --to "s3://nix-cache?endpoint=http://seaweedfs-s3.seaweedfs.svc.cluster.local:8333&scheme=http" ./nix#ci

      - name: Report Failure
        if: failure()
        run: |
          echo "${{ matrix.service.name }}" > failure-${{ matrix.service.name }}.txt
        
      - name: Upload Failure Artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-${{ matrix.service.name }}
          path: failure-${{ matrix.service.name }}.txt
          retention-days: 1

  notify-end:
    name: Notify End
    needs: [security-check, analyze, validate-service]
    if: always() && needs.security-check.outputs.is_safe == 'true'
    runs-on: playground-runner
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Download Failure Artifacts
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: failure-*
          path: failures
          merge-multiple: true

      - name: Send completion notification
        run: |
          # Check if build was skipped entirely (analyze determined no changes)
          if [ "${{ needs.analyze.outputs.has_changes }}" == "false" ]; then
             echo "No changes detected, skipping notification."
             exit 0
          fi

          # Check for failures
          if [ -d "failures" ] && [ "$(ls -A failures)" ]; then
             FAILED_SERVICES=$(cat failures/* | tr '\n' ', ' | sed 's/, $//')
             STATUS="FAILURE"
             MSG="Build failed for the following services: $FAILED_SERVICES"
          elif [ "${{ needs.validate-service.result }}" == "cancelled" ]; then
             STATUS="FAILURE"
             MSG="Build cancelled."
          elif [ "${{ needs.validate-service.result }}" == "failure" ]; then
             # Fallback if result is failure but no artifacts (e.g. infrastructure fail)
             STATUS="FAILURE"
             MSG="Build failed (Infrastructure or Setup error)."
          else
             STATUS="SUCCESS"
             MSG="Pipeline completed successfully for all services."
          fi

          ./tools/ci/notify_discord.sh "$STATUS" "CI Pipeline" "$MSG"
