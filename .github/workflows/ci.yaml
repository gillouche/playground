name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  packages: none
  actions: none
  id-token: none

jobs:
  security-check:
    name: Security Check
    runs-on: ubuntu-latest
    if: github.repository_owner == 'gillouche'
    outputs:
      is_safe: ${{ steps.gate.outputs.is_safe }}
    steps:
      - uses: actions/checkout@v6
      - uses: gillouche/homelab-ci/actions/security-gate@main
        id: gate

  demo-app:
    name: demo-app
    needs: security-check
    if: needs.security-check.outputs.is_safe == 'true'
    runs-on: playground-runner
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Nix Cache Profile
        uses: gillouche/homelab-ci/actions/setup-aws-profile@main
        with:
          profile: nix
          access-key-id: ${{ secrets.NIX_CACHE_ACCESS_KEY }}
          secret-access-key: ${{ secrets.NIX_CACHE_SECRET_KEY }}

      - name: Setup Nix Environment
        uses: gillouche/homelab-ci/actions/setup-nix-env@main

      - name: Inject Nexus CA into Docker Daemon
        run: |
          sudo mkdir -p /etc/docker/certs.d/nexus.gillouche.homelab
          sudo cp /usr/local/share/ca-certificates/nexus-ca.crt \
            /etc/docker/certs.d/nexus.gillouche.homelab/ca.crt

      - name: Login to Nexus registry
        run: |
          { set +x; } 2>/dev/null
          echo "${{ secrets.NEXUS_PASSWORD }}" | docker login nexus.gillouche.homelab \
            -u "${{ secrets.NEXUS_USERNAME }}" \
            --password-stdin

      - name: Build & Test
        run: |
          { set +x; } 2>/dev/null
          nix develop ./nix#ci --command bazel build --config=ci \
            //apps/demo-app/...
          nix develop ./nix#ci --command bazel test --config=ci \
            //apps/demo-app/... \
            || { rc=$?; if [ $rc -eq 4 ]; then \
            echo "No test targets found, skipping"; else exit $rc; fi; }

      - name: Publish test results
        if: always() && hashFiles('bazel-testlogs/**/test.xml') != ''
        uses: dorny/test-reporter@v2
        with:
          name: demo-app tests
          path: bazel-testlogs/**/test.xml
          reporter: java-junit
          fail-on-error: true

  api-lab:
    name: api-lab
    needs: security-check
    if: needs.security-check.outputs.is_safe == 'true'
    runs-on: playground-runner
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Nix Cache Profile
        uses: gillouche/homelab-ci/actions/setup-aws-profile@main
        with:
          profile: nix
          access-key-id: ${{ secrets.NIX_CACHE_ACCESS_KEY }}
          secret-access-key: ${{ secrets.NIX_CACHE_SECRET_KEY }}

      - name: Setup Nix Environment
        uses: gillouche/homelab-ci/actions/setup-nix-env@main

      - name: Inject Nexus CA into Docker Daemon
        run: |
          sudo mkdir -p /etc/docker/certs.d/nexus.gillouche.homelab
          sudo cp /usr/local/share/ca-certificates/nexus-ca.crt \
            /etc/docker/certs.d/nexus.gillouche.homelab/ca.crt

      - name: Login to Nexus registry
        run: |
          { set +x; } 2>/dev/null
          echo "${{ secrets.NEXUS_PASSWORD }}" | docker login nexus.gillouche.homelab \
            -u "${{ secrets.NEXUS_USERNAME }}" \
            --password-stdin

      - name: Build & Test
        run: |
          { set +x; } 2>/dev/null
          nix develop ./nix#ci --command bazel build --config=ci \
            //apps/api-lab/...
          nix develop ./nix#ci --command bazel test --config=ci \
            --test_tag_filters=-system \
            //apps/api-lab/... \
            || { rc=$?; if [ $rc -eq 4 ]; then \
            echo "No test targets found, skipping"; else exit $rc; fi; }

      - name: Run bandit security scan
        run: |
          nix develop ./nix#ci --command uv tool run bandit -r apps/api-lab/python-rest-api/src apps/api-lab/python-common/src apps/api-lab/python-auth-api/src apps/api-lab/graphql-gateway/src apps/api-lab/python-grpc-api/src -c apps/api-lab/.bandit.yaml

      - name: Run pip-audit
        run: |
          nix develop ./nix#ci --command uv tool run pip-audit -r apps/api-lab/requirements_lock.txt

      - name: Publish test results
        if: always() && hashFiles('bazel-testlogs/**/test.xml') != ''
        uses: dorny/test-reporter@v2
        with:
          name: api-lab tests
          path: bazel-testlogs/**/test.xml
          reporter: java-junit
          fail-on-error: true

      - name: API Coverage Report
        if: always()
        continue-on-error: true
        run: python3 apps/api-lab/tools/api_coverage.py --github-summary

      - name: Push images (Main Only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          { set +x; } 2>/dev/null
          SHORT_SHA=$(echo $GITHUB_SHA | cut -c1-7)
          nix develop ./nix#ci --command bazel run --config=ci \
            //apps/api-lab/go-api:go-api_push \
            -- --tag latest --tag "$SHORT_SHA"
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}

  system-test-api-lab:
    name: api-lab/system-tests
    needs: [security-check, api-lab]
    if: >-
      needs.security-check.outputs.is_safe == 'true' &&
      needs.api-lab.result == 'success'
    runs-on: playground-runner
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Nix Cache Profile
        uses: gillouche/homelab-ci/actions/setup-aws-profile@main
        with:
          profile: nix
          access-key-id: ${{ secrets.NIX_CACHE_ACCESS_KEY }}
          secret-access-key: ${{ secrets.NIX_CACHE_SECRET_KEY }}

      - name: Setup Nix Environment
        uses: gillouche/homelab-ci/actions/setup-nix-env@main

      - name: Inject Nexus CA into Docker Daemon
        run: |
          sudo mkdir -p /etc/docker/certs.d/nexus.gillouche.homelab
          sudo cp /usr/local/share/ca-certificates/nexus-ca.crt \
            /etc/docker/certs.d/nexus.gillouche.homelab/ca.crt

      - name: Login to Nexus registry
        run: |
          { set +x; } 2>/dev/null
          echo "${{ secrets.NEXUS_PASSWORD }}" | docker login nexus.gillouche.homelab \
            -u "${{ secrets.NEXUS_USERNAME }}" \
            --password-stdin

      - name: Start infrastructure
        run: |
          if docker compose version &>/dev/null; then
            COMPOSE="docker compose"
          else
            COMPOSE="docker-compose"
          fi
          COMPOSE_CMD="$COMPOSE -f infra/sandbox/localhost/docker-compose.yaml"
          $COMPOSE_CMD up -d postgres redis
          until $COMPOSE_CMD exec -T postgres pg_isready -U playground; do
            sleep 2
          done
          until $COMPOSE_CMD exec -T redis redis-cli -a playground ping \
            | grep PONG; do sleep 2; done
          $COMPOSE_CMD exec -T postgres \
            psql -U playground -c "CREATE DATABASE api_lab" || true
          $COMPOSE_CMD exec -T postgres \
            psql -U playground -c "CREATE DATABASE keycloak" || true
          $COMPOSE_CMD up -d keycloak
          until curl -sf http://localhost:8180/realms/api-lab/.well-known/openid-configuration > /dev/null; do
            sleep 3
          done
          bash infra/sandbox/localhost/keycloak/setup-realm.sh

      - name: Build, migrate, start services, and run system tests
        run: |
          { set +x; } 2>/dev/null
          export POSTGRES_HOST=localhost POSTGRES_DATABASE=api_lab
          export POSTGRES_USER=playground POSTGRES_PASSWORD=playground
          export REDIS_HOST=localhost REDIS_PORT=6379
          export REDIS_PASSWORD=playground
          export ENABLE_TRACING=false
          export REST_API_URL=http://localhost:8080
          export API_BASE_URL=http://localhost:8080
          export AUTH_API_URL=http://localhost:8084
          export GRAPHQL_BASE_URL=http://localhost:8083
          export GRPC_HOST=localhost:50051
          export KEYCLOAK_SERVER_URL=http://localhost:8180
          export KEYCLOAK_CLIENT_ID=api-lab
          export KEYCLOAK_CLIENT_SECRET=api-lab-secret
          export KEYCLOAK_AUTH_SERVICE_CLIENT_ID=api-lab-auth-service
          export KEYCLOAK_AUTH_SERVICE_CLIENT_SECRET=api-lab-auth-service-secret

          nix develop ./nix#ci --command bash -c '
            set -e

            echo "=== Building all targets ==="
            bazel build --config=ci \
              //apps/api-lab/database:migrate \
              //apps/api-lab/python-rest-api \
              //apps/api-lab/python-auth-api \
              //apps/api-lab/python-grpc-api \
              //apps/api-lab/graphql-gateway \
              //apps/api-lab/system-tests:system-tests

            echo "=== Running database migrations ==="
            bazel run --config=ci //apps/api-lab/database:migrate

            echo "=== Starting services ==="
            bazel run --config=ci //apps/api-lab/python-rest-api &
            bazel run --config=ci //apps/api-lab/python-auth-api &
            bazel run --config=ci //apps/api-lab/python-grpc-api &
            REST_API_URL=http://localhost:8080 \
              bazel run --config=ci //apps/api-lab/graphql-gateway &

            echo "Waiting for REST API..."
            until curl -sf http://localhost:8080/healthz; do sleep 2; done
            echo "Waiting for Auth API..."
            until curl -sf http://localhost:8084/healthz; do sleep 2; done
            echo "Waiting for GraphQL gateway..."
            until curl -sf http://localhost:8083/healthz; do sleep 2; done
            echo "Waiting for gRPC..."
            sleep 3

            echo "=== Running system tests ==="
            bazel test --config=ci \
              --test_tag_filters=system \
              --test_env=API_BASE_URL \
              --test_env=AUTH_API_URL \
              --test_env=GRAPHQL_BASE_URL \
              --test_env=GRPC_HOST \
              --test_env=POSTGRES_HOST \
              --test_env=POSTGRES_DATABASE \
              --test_env=POSTGRES_USER \
              --test_env=POSTGRES_PASSWORD \
              --test_env=REDIS_HOST \
              --test_env=REDIS_PORT \
              --test_env=REDIS_PASSWORD \
              --test_env=KEYCLOAK_SERVER_URL \
              //apps/api-lab/system-tests:system-tests
          '

      - name: Publish test results
        if: always() && hashFiles('bazel-testlogs/**/test.xml') != ''
        uses: dorny/test-reporter@v2
        with:
          name: api-lab system tests
          path: bazel-testlogs/**/test.xml
          reporter: java-junit
          fail-on-error: true

      - name: Cleanup
        if: always()
        run: |
          if docker compose version &>/dev/null; then
            docker compose -f infra/sandbox/localhost/docker-compose.yaml \
              down -v || true
          else
            docker-compose -f infra/sandbox/localhost/docker-compose.yaml \
              down -v || true
          fi

  finalize:
    name: Finalize
    needs: [security-check, demo-app, api-lab, system-test-api-lab]
    if: always() && needs.security-check.outputs.is_safe == 'true'
    runs-on: playground-runner
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Nix Cache Profile
        if: >-
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          needs.api-lab.result == 'success' &&
          needs.demo-app.result == 'success'
        uses: gillouche/homelab-ci/actions/setup-aws-profile@main
        with:
          profile: nix
          access-key-id: ${{ secrets.NIX_CACHE_ACCESS_KEY }}
          secret-access-key: ${{ secrets.NIX_CACHE_SECRET_KEY }}

      - name: Setup Nix Environment
        if: >-
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          needs.api-lab.result == 'success' &&
          needs.demo-app.result == 'success'
        uses: gillouche/homelab-ci/actions/setup-nix-env@main

      - name: Push to Nix Cache (Main Only)
        if: >-
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          needs.api-lab.result == 'success' &&
          needs.demo-app.result == 'success'
        run: |
          { set +x; } 2>/dev/null
          echo "Pushing build artifacts to Nix Cache..."
          nix copy --to \
            "s3://nix-cache?endpoint=http://seaweedfs-s3.seaweedfs.svc.cluster.local:8333&scheme=http&profile=nix" \
            ./nix#ci

      - name: Send Success Notification
        if: >-
          needs.api-lab.result == 'success' &&
          needs.demo-app.result == 'success'
        uses: gillouche/homelab-ci/actions/discord-notify@main
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_GITHUB_ACTIONS }}
          status: success
          title: CI Pipeline Result
          url: >-
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          message: "Build completed successfully"
          fields: |
            [
              {"name": "Repository", "value": "${{ github.repository }}", "inline": true},
              {"name": "Ref", "value": "${{ github.ref_name }}", "inline": true},
              {"name": "Commit", "value": "`${{ github.sha }}`", "inline": false},
              {"name": "Actor", "value": "${{ github.actor }}", "inline": true},
              {"name": "Trigger", "value": "${{ github.event_name }}", "inline": true}
            ]

      - name: Send Failure Notification
        if: >-
          needs.api-lab.result != 'success' ||
          needs.demo-app.result != 'success'
        uses: gillouche/homelab-ci/actions/discord-notify@main
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_GITHUB_ACTIONS }}
          status: failure
          title: CI Pipeline Result
          url: >-
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          message: "Build failed"
          fields: |
            [
              {"name": "Repository", "value": "${{ github.repository }}", "inline": true},
              {"name": "Ref", "value": "${{ github.ref_name }}", "inline": true},
              {"name": "Commit", "value": "`${{ github.sha }}`", "inline": false},
              {"name": "Actor", "value": "${{ github.actor }}", "inline": true},
              {"name": "Trigger", "value": "${{ github.event_name }}", "inline": true}
            ]
