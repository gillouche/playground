name: Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: none
  actions: none
  id-token: none

env:
  IS_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}

jobs:
  build-and-test:
    name: Build & Test
    if: >
      github.event_name == 'push' ||
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.head.repo.fork == false
      )
    runs-on: playground-runner
    timeout-minutes: 30
    env:
      PLAYGROUND_ROOT: ${{ github.workspace }}

    steps:
      - name: Abort immediately if fork detected
        if: env.IS_FORK == 'true'
        run: |
          echo "Fork PR detected - refusing to run on self-hosted runner"
          if [ -n "$DISCORD_WEBHOOK_URL" ]; then
            curl -s -H "Content-Type: application/json" -d '{
              "embeds": [{
                "title": "Fork son hosted runner - CI Pipeline",
                "description": "Fork PR detected attempting to run on self-hosted runner. Blocked.",
                "color": 15158332,
                "fields": [
                  {"name": "Repository", "value": "'"$GITHUB_REPOSITORY"'", "inline": true},
                  {"name": "PR", "value": "'"$GITHUB_REF"'", "inline": true},
                  {"name": "Actor", "value": "'"$GITHUB_ACTOR"'", "inline": true}
                ],
                "footer": {"text": "GitHub Actions • CI Pipeline"},
                "timestamp": "'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'"
              }]
            }' "$DISCORD_WEBHOOK_URL"
          fi
          exit 1

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Send start notification
        run: |
          ./tools/scripts/notify_discord.sh START "CI Pipeline" "Build started for commit $GITHUB_SHA"

      - name: Load SeaweedFS credentials
        run: |
          # SeaweedFS S3 credentials for Bazel remote cache
          echo "AWS_ACCESS_KEY_ID=$SEAWEEDFS_ACCESS_KEY" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=$SEAWEEDFS_SECRET_KEY" >> $GITHUB_ENV

      - name: Build
        run: |
          nix develop ./nix#ci --command bazelisk build --config=ci //...

      - name: Unit Tests & Coverage
        run: |
          nix develop ./nix#ci --command bash -c "bazelisk query 'attr(tags, unit, //...)' | while read target; do echo \">>> Running \$target\"; bazelisk run \"\$target\" || exit 1; done"

      - name: Lint
        run: |
          nix develop ./nix#ci --command bash -c "bazelisk query 'attr(tags, lint, //...)' | while read target; do echo \">>> Running \$target\"; bazelisk run \"\$target\" || exit 1; done"

      - name: Integration Tests & Coverage
        run: |
          nix develop ./nix#ci --command bash -c "bazelisk query 'attr(tags, integration, //...)' | while read target; do echo \">>> Running \$target\"; bazelisk run \"\$target\" || exit 1; done"

  package-and-push:
    name: Package & Push (main only)
    needs: build-and-test
    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    runs-on: playground-runner
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      image_pushed: ${{ steps.push.outputs.image_pushed }}
      image_tag: ${{ steps.push.outputs.image_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Load Secrets from Runner Env
        run: |
          echo "NEXUS_USERNAME=$NEXUS_USERNAME" >> $GITHUB_ENV
          echo "NEXUS_PASSWORD=$NEXUS_PASSWORD" >> $GITHUB_ENV

      - name: Login to Nexus
        uses: docker/login-action@v3
        with:
          registry: nexus.gillouche.homelab
          username: ${{ env.NEXUS_USERNAME }}
          password: ${{ env.NEXUS_PASSWORD }}

      - name: Push container images
        id: push
        run: |
          export DOCKER_CONFIG="$HOME/.docker"

          echo "Run smart push..."
          OUTPUT=$(nix develop ./nix#ci --command bazelisk run //tools:smart_push 2>&1 | tee /dev/stderr)

          # Parse the SMART_PUSH_RESULT line
          RESULT_LINE=$(echo "$OUTPUT" | grep "SMART_PUSH_RESULT:" || echo "")
          if echo "$RESULT_LINE" | grep -q "image_pushed=true"; then
            IMAGE_TAG=$(echo "$RESULT_LINE" | grep -oP 'image_tag=\K[^\s]+')
            echo "image_pushed=true" >> "$GITHUB_OUTPUT"
            echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "image_pushed=false" >> "$GITHUB_OUTPUT"
            echo "image_tag=" >> "$GITHUB_OUTPUT"
          fi

  notify-end:
    name: Notify End
    needs: [build-and-test, package-and-push]
    if: always()
    runs-on: playground-runner
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Send completion notification
        env:
          IMAGE_PUSHED: ${{ needs.package-and-push.outputs.image_pushed }}
          IMAGE_TAG: ${{ needs.package-and-push.outputs.image_tag }}
        run: |
          if [ "${{ needs.build-and-test.result }}" == "failure" ] || [ "${{ needs.package-and-push.result }}" == "failure" ]; then
            STATUS="FAILURE"
            MSG="Build or deployment failed."
          elif [ "${{ needs.build-and-test.result }}" == "cancelled" ]; then
            STATUS="FAILURE"
            MSG="Build cancelled."
          elif [ "${{ needs.build-and-test.result }}" == "skipped" ]; then
            # Build was skipped (e.g., fork PR) - don't notify
            echo "Build was skipped, no notification needed"
            exit 0
          else
            STATUS="SUCCESS"
            if [ "$IMAGE_PUSHED" == "true" ] && [ -n "$IMAGE_TAG" ]; then
              MSG="Build successful. Image pushed: $IMAGE_TAG"
            else
              MSG="Build successful. No code changes detected."
            fi
          fi

          ./tools/scripts/notify_discord.sh "$STATUS" "CI Pipeline" "$MSG"
