name: Release to Prod

on:
  workflow_dispatch:
    inputs:
      app:
        description: 'App to release (e.g., demo-concept)'
        required: true
        type: string
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    steps:
      - name: Checkout playground repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Find app directory
        id: find
        run: |
          APP_DIR=$(find apps -type d -name "${{ github.event.inputs.app }}" | head -1)
          if [ -z "$APP_DIR" ]; then
            echo "❌ App not found: ${{ github.event.inputs.app }}"
            exit 1
          fi
          echo "✅ Found app at: $APP_DIR"
          echo "app_dir=$APP_DIR" >> $GITHUB_OUTPUT
      
      - name: Create prod overlay if missing
        run: |
          PROD_DIR="${{ steps.find.outputs.app_dir }}/deploy/prod"
          if [ ! -d "$PROD_DIR" ]; then
            echo "📁 Creating prod overlay directory..."
            mkdir -p "$PROD_DIR"
            cat > "$PROD_DIR/kustomization.yaml" <<EOF
          apiVersion: kustomize.config.k8s.io/v1beta1
          kind: Kustomization
          
          resources:
            - ../base
          
          images:
            - name: ${{ github.event.inputs.app }}
              newName: nexus.gillouche.homelab/repository/docker-hosted/playground/${{ github.event.inputs.app }}
              newTag: ${{ github.event.inputs.version }}
          EOF
            echo "✅ Created prod overlay"
          else
            echo "✅ Prod overlay already exists"
          fi
      
      - name: Update image tag
        run: |
          cd "${{ steps.find.outputs.app_dir }}/deploy/prod"
          
          echo "🏷️  Updating image tag to ${{ github.event.inputs.version }}..."
          
          # Update or add image tag
          if grep -q "newTag:" kustomization.yaml; then
            sed -i "s/newTag: .*/newTag: ${{ github.event.inputs.version }}/" kustomization.yaml
          else
            echo "  - name: ${{ github.event.inputs.app }}" >> kustomization.yaml
            echo "    newTag: ${{ github.event.inputs.version }}" >> kustomization.yaml
          fi
          
          echo "✅ Updated kustomization.yaml"
          cat kustomization.yaml
      
      - name: Commit and push
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add "${{ steps.find.outputs.app_dir }}/deploy/prod/"
          git commit -m "🚀 Release ${{ github.event.inputs.app }} ${{ github.event.inputs.version }}"
          git push
          
          echo "✅ Released ${{ github.event.inputs.app }} ${{ github.event.inputs.version }}"
