name: Nightly Security Scan

on:
  schedule:
    # Run at 2 AM UTC every day
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: none
  actions: none
  id-token: none

env:
  TRIVY_CACHE_DIR: /home/runner/.cache/trivy

jobs:
  # Security gate for self-hosted runners
  security-check:
    name: Security Check
    runs-on: ubuntu-latest
    outputs:
      is_safe: ${{ steps.check.outputs.is_safe }}
    steps:
      - name: Verify repository ownership
        id: check
        run: |
          if [[ "${{ github.repository }}" != "gillouche/playground" ]]; then
            echo "::error::Repository mismatch - blocking execution"
            echo "is_safe=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          echo "is_safe=true" >> "$GITHUB_OUTPUT"

  discover-services:
    name: Discover Services
    needs: security-check
    if: needs.security-check.outputs.is_safe == 'true'
    runs-on: playground-runner
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.services.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Nix Environment
        uses: ./.github/actions/setup-nix-env

      - name: Find all services
        id: services
        run: |
          # Find all services with build_docker targets
          SERVICES=$(nix develop \
            --extra-substituters "s3://nix-cache?endpoint=http://seaweedfs-s3.seaweedfs.svc.cluster.local:8333&scheme=http" \
            --extra-trusted-public-keys "cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=" \
            ./nix#ci --command bazel query "kind(oci_load, //apps/...)" 2>/dev/null | \
            grep "^//" | \
            sed 's/:build_docker$//' | \
            while read path; do
              name=$(basename "$path")
              echo "{\"name\": \"$name\", \"path\": \"${path#//}\"}"
            done | jq -sc '.')
          echo "matrix=$SERVICES" >> "$GITHUB_OUTPUT"
          echo "Found services: $SERVICES"

  scan-service:
    name: Scan ${{ matrix.service.name }}
    needs: [security-check, discover-services]
    if: needs.security-check.outputs.is_safe == 'true'
    runs-on: playground-runner
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.discover-services.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Nix Environment
        uses: ./.github/actions/setup-nix-env

      - name: Build and Scan
        run: |
          nix develop \
            --extra-substituters "s3://nix-cache?endpoint=http://seaweedfs-s3.seaweedfs.svc.cluster.local:8333&scheme=http" \
            --extra-trusted-public-keys "cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=" \
            ./nix#ci --command bash -c '
            set -e

            echo "Building image for ${{ matrix.service.name }}..."
            bazel run --config=ci //${{ matrix.service.path }}:build_docker

            echo "Scanning image for vulnerabilities..."
            trivy image --exit-code 0 --severity HIGH,CRITICAL --format json --output trivy-results.json ${{ matrix.service.name }}:latest

            if [ -f trivy-results.json ]; then
               ISSUES=$(jq -r '\''if .Results then (.Results[]? | .Vulnerabilities[]? | "- " + .PkgName + " (" + .VulnerabilityID + "): " + .Title) else empty end'\'' trivy-results.json | head -c 1900)

               if [ -n "$ISSUES" ]; then
                   echo "Critical/High Vulnerabilities found:"
                   echo "$ISSUES"
                   echo "$ISSUES"
                   ./tools/ci/notify_discord.sh "WARNING" "Trivy Scan: ${{ matrix.service.name }}" "Found Critical/High Vulnerabilities:\n$ISSUES"
                   echo "${{ matrix.service.name }}" > vulnerable-service.txt
               else
                   echo "No critical vulnerabilities found."
               fi
            fi
          '

      - name: Upload Vulnerability Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vulnerable-${{ matrix.service.name }}
          path: vulnerable-service.txt
          if-no-files-found: ignore
          retention-days: 1

  notify-completion:
    name: Notify Completion
    needs: [security-check, discover-services, scan-service]
    if: always() && needs.security-check.outputs.is_safe == 'true'
    runs-on: playground-runner
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Download Vulnerability Artifacts
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: vulnerable-*
          path: issues
          merge-multiple: true

      - name: Send completion notification
        run: |
          # Check for vulnerabilities
          if [ -d "issues" ] && [ "$(ls -A issues)" ]; then
             VULNERABLE_SERVICES=$(cat issues/* | tr '\n' ', ' | sed 's/, $//')
             ./tools/ci/notify_discord.sh "WARNING" "Nightly Security Scan" "Vulnerabilities found in the following services: $VULNERABLE_SERVICES. Check individual notifications for details."
          elif [ "${{ needs.scan-service.result }}" != "success" ] && [ "${{ needs.scan-service.result }}" != "skipped" ]; then
             # skipped means discover found nothing, which is fine. Not sure if Result is success or skipped then.
             # If discover failed, scan is skipped/cancelled.
             ./tools/ci/notify_discord.sh "FAILURE" "Nightly Security Scan" "Security execution failed (Build or Infra error). Check workflow."
          else
             ./tools/ci/notify_discord.sh "SUCCESS" "Nightly Security Scan" "All services scanned successfully. No critical vulnerabilities found."
          fi
