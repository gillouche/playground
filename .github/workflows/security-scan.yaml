name: Nightly Security Scan

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: none
  actions: none
  id-token: none

env:
  TRIVY_CACHE_DIR: /home/runner/.cache/trivy

jobs:
  security-check:
    name: Security Check
    runs-on: ubuntu-latest
    if: github.repository_owner == 'gillouche'
    outputs:
      is_safe: ${{ steps.gate.outputs.is_safe }}
    steps:
      - uses: actions/checkout@v4
      - uses: gillouche/homelab-ci/actions/security-gate@f1ce96ddb91e83c928bf76940005cbcaaab4d1fb # main
        id: gate

  discover-services:
    name: Discover Services
    needs: security-check
    if: needs.security-check.outputs.is_safe == 'true'
    runs-on: playground-runner
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.services.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Nix Cache Profile
        uses: gillouche/homelab-ci/actions/setup-aws-profile@f1ce96ddb91e83c928bf76940005cbcaaab4d1fb # main
        with:
          profile: "nix"
          access-key-id: ${{ secrets.NIX_CACHE_ACCESS_KEY }}
          secret-access-key: ${{ secrets.NIX_CACHE_SECRET_KEY }}

      - name: Setup Nix Environment
        uses: gillouche/homelab-ci/actions/setup-nix-env@f1ce96ddb91e83c928bf76940005cbcaaab4d1fb # main

      - name: Find all services
        id: services
        run: |
          { set +x; } 2>/dev/null
          SERVICES=$(nix develop ./nix#ci --command bazel query 'kind(oci_load, //apps/...)' 2>/dev/null | \
            grep "^//" | \
            while read target; do
              package="${target%:*}"
              package="${package#//}"
              target_name="${target##*:}"
              name="${target_name%_load}"
              echo "{\"name\": \"$name\", \"package\": \"$package\", \"target\": \"$target_name\"}"
            done | jq -sc '.')
          echo "matrix=$SERVICES" >> "$GITHUB_OUTPUT"
          echo "Found services: $SERVICES"

  scan-service:
    name: Scan ${{ matrix.service.name }}
    needs: [security-check, discover-services]
    if: needs.security-check.outputs.is_safe == 'true' && needs.discover-services.outputs.matrix != '[]'
    runs-on: playground-runner
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.discover-services.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Nix Cache Profile
        uses: gillouche/homelab-ci/actions/setup-aws-profile@f1ce96ddb91e83c928bf76940005cbcaaab4d1fb # main
        with:
          profile: "nix"
          access-key-id: ${{ secrets.NIX_CACHE_ACCESS_KEY }}
          secret-access-key: ${{ secrets.NIX_CACHE_SECRET_KEY }}

      - name: Setup Nix Environment
        uses: gillouche/homelab-ci/actions/setup-nix-env@f1ce96ddb91e83c928bf76940005cbcaaab4d1fb # main

      - name: Build Image
        run: |
          { set +x; } 2>/dev/null
          nix develop ./nix#ci --command bazel run --config=ci //${{ matrix.service.package }}:${{ matrix.service.target }}

      - name: Trivy Scan
        uses: gillouche/homelab-ci/actions/trivy-scan@f1ce96ddb91e83c928bf76940005cbcaaab4d1fb # main
        with:
          image: ${{ matrix.service.name }}:latest
          trivyignore: .trivyignore
          discord-webhook: ${{ secrets.DISCORD_WEBHOOK_SECURITY }}

      - name: Flag Vulnerability
        if: failure()
        run: echo "${{ matrix.service.name }}" > vulnerable-service.txt

      - name: Upload Vulnerability Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vulnerable-${{ matrix.service.name }}
          path: vulnerable-service.txt
          if-no-files-found: ignore
          retention-days: 1

  notify-completion:
    name: Notify Completion
    needs: [security-check, discover-services, scan-service]
    if: always() && needs.security-check.outputs.is_safe == 'true'
    runs-on: playground-runner
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Download Vulnerability Artifacts
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: vulnerable-*
          path: issues
          merge-multiple: true

      - name: Send completion notification
        uses: gillouche/homelab-ci/actions/discord-notify@f1ce96ddb91e83c928bf76940005cbcaaab4d1fb # main
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_GITHUB_ACTIONS }}
          status: ${{ needs.scan-service.result == 'success' && 'success' || 'failure' }}
          title: Nightly Security Scan
          message: >-
             ${{ needs.scan-service.result == 'success' &&
             'All services scanned successfully. No critical vulnerabilities found.' ||
             'Security scan found issues. Check individual notifications.' }}
