name: SonarQube Analysis

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      scan_all:
        description: "Scan all services (ignore change detection)"
        type: boolean
        default: false

permissions:
  contents: read
  packages: none
  actions: none
  id-token: none

jobs:
  security-check:
    name: Security Check
    runs-on: ubuntu-latest
    if: github.repository_owner == 'gillouche'
    outputs:
      is_safe: ${{ steps.gate.outputs.is_safe }}
    steps:
      - uses: actions/checkout@v6
      - uses: gillouche/homelab-ci/actions/security-gate@main
        id: gate

  discover-services:
    name: Discover Changed Services
    needs: security-check
    if: needs.security-check.outputs.is_safe == 'true'
    runs-on: playground-runner
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.services.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Nix Cache Profile
        uses: gillouche/homelab-ci/actions/setup-aws-profile@main
        with:
          profile: nix
          access-key-id: ${{ secrets.NIX_CACHE_ACCESS_KEY }}
          secret-access-key: ${{ secrets.NIX_CACHE_SECRET_KEY }}

      - name: Setup Nix Environment
        uses: gillouche/homelab-ci/actions/setup-nix-env@main

      - name: Detect affected services
        id: services
        run: |
          { set +x; } 2>/dev/null

          # system-tests are integration scaffolding (not production code), so we
          # exclude them from SonarQube quality analysis. tools/scripts are dev
          # utilities; deploy/monitoring/__pycache__ aren't source.
          SKIP_NAMES="deploy|monitoring|__pycache__|system-tests|scripts|tools"
          ALL_SERVICES=$(find apps -mindepth 2 -maxdepth 2 -type d | \
            grep -vE "($SKIP_NAMES)" | sort)

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.scan_all }}" = "true" ]; then
            echo "Manual dispatch (scan all) — scanning all services"
            AFFECTED_DIRS="$ALL_SERVICES"
          else
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              DIFF_BASE="${{ github.event.pull_request.base.sha }}"
            else
              DIFF_BASE="HEAD~1"
            fi

            CHANGED_FILES=$(git diff --name-only "$DIFF_BASE" HEAD 2>/dev/null || echo "")
            if [ -z "$CHANGED_FILES" ]; then
              echo "Could not determine changed files — scanning all services"
              AFFECTED_DIRS="$ALL_SERVICES"
            else
              echo "Changed files:"
              echo "$CHANGED_FILES" | head -30

              AFFECTED_DIRS=""
              nix develop ./nix#ci --command bash << 'NIXEOF'
                set -uo pipefail

                CHANGED_FILES=$(git diff --name-only "$0" HEAD 2>/dev/null)

                AFFECTED_TARGETS=""
                while IFS= read -r file; do
                  [ -z "$file" ] && continue
                  [ ! -f "$file" ] && continue

                  FILE_LABEL=$(bazel query "$file" 2>/dev/null || true)
                  if [ -n "$FILE_LABEL" ]; then
                    RDEPS=$(bazel query "rdeps(//apps/..., $FILE_LABEL)" 2>/dev/null || true)
                    AFFECTED_TARGETS="$AFFECTED_TARGETS
          $RDEPS"
                  fi
                done <<< "$CHANGED_FILES"

                echo "$AFFECTED_TARGETS" | grep -oE "//apps/[^/]+/[^/:]+[:/]" | \
                  sed 's|^//||; s|[:/]$||' | sort -u > /tmp/affected_dirs.txt

                while read -r dir; do
                  [ -z "$dir" ] && continue
                  echo "AFFECTED: $dir"
                done < /tmp/affected_dirs.txt
          NIXEOF

              if [ -f /tmp/affected_dirs.txt ]; then
                AFFECTED_DIRS=$(cat /tmp/affected_dirs.txt | grep -v '^$' || true)
              fi

              if [ -z "$AFFECTED_DIRS" ]; then
                echo "Bazel rdeps found no affected targets, falling back to directory matching"
                for dir in $ALL_SERVICES; do
                  if echo "$CHANGED_FILES" | grep -q "^${dir}/"; then
                    echo "FALLBACK MATCH: $dir"
                    AFFECTED_DIRS="$AFFECTED_DIRS $dir"
                  fi
                done
              fi
            fi
          fi

          FILTERED=$(echo "$AFFECTED_DIRS" | tr ' ' '\n' | grep -v '^$' | sort -u | \
            while read -r dir; do
              svc=$(basename "$dir")
              if echo "$svc" | grep -qE "^($SKIP_NAMES)$"; then
                continue
              fi
              echo "$dir"
            done)

          SERVICES=$(echo "$FILTERED" | grep -v '^$' | \
            while read -r dir; do
              app=$(basename "$(dirname "$dir")")
              service=$(basename "$dir")
              project_key="${app}:${service}"
              jq -n -c \
                --arg app "$app" \
                --arg service "$service" \
                --arg path "$dir" \
                --arg pk "$project_key" \
                '{app: $app, service: $service, path: $path, project_key: $pk}'
            done | jq -sc '.')

          if [ "$SERVICES" = "[]" ] || [ -z "$SERVICES" ] || [ "$SERVICES" = "null" ]; then
            SERVICES="[]"
            echo "No services affected — skipping SonarQube analysis"
          fi

          echo "matrix=$SERVICES" >> "$GITHUB_OUTPUT"
          echo "Services to analyze: $SERVICES"
        env:
          AWS_PROFILE: "nix"

  sonarqube:
    name: Analyze ${{ matrix.service.project_key }}
    needs: [security-check, discover-services]
    if: >-
      needs.security-check.outputs.is_safe == 'true' &&
      needs.discover-services.outputs.matrix != '[]' &&
      needs.discover-services.outputs.matrix != ''
    runs-on: playground-runner
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.discover-services.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Nix Cache Profile
        uses: gillouche/homelab-ci/actions/setup-aws-profile@main
        with:
          profile: "nix"
          access-key-id: ${{ secrets.NIX_CACHE_ACCESS_KEY }}
          secret-access-key: ${{ secrets.NIX_CACHE_SECRET_KEY }}

      - name: Setup Nix Environment
        uses: gillouche/homelab-ci/actions/setup-nix-env@main

      - name: Run Tests with Coverage
        run: |
          { set +x; } 2>/dev/null
          nix develop ./nix#ci --command bash -c '
            set -e

            SERVICE_PATH="${{ matrix.service.path }}"
            echo "Running tests with coverage for $SERVICE_PATH"

            cd "$SERVICE_PATH"

            REQS_DIR="."
            if [ -f "requirements_lock.txt" ] || [ -f "requirements.txt" ]; then
              REQS_DIR="."
            elif [ -f "../requirements_lock.txt" ] || [ -f "../requirements.txt" ]; then
              REQS_DIR=".."
            fi

            if [ "$REQS_DIR" != "." ] || [ -f "requirements_lock.txt" ] || [ -f "requirements.txt" ]; then
              echo "Detected Python project (requirements in $REQS_DIR)"
              if [ -d "tests" ]; then
                uv venv .venv
                source .venv/bin/activate

                if [ -f "$REQS_DIR/requirements_dev_lock.txt" ]; then
                  uv pip install -r "$REQS_DIR/requirements_dev_lock.txt" -q
                elif [ -f "$REQS_DIR/requirements_lock.txt" ]; then
                  uv pip install -r "$REQS_DIR/requirements_lock.txt" -q
                elif [ -f "$REQS_DIR/requirements.txt" ]; then
                  uv pip install -r "$REQS_DIR/requirements.txt" -q
                fi

                PYTHONPATH_EXTRA=""
                if [ -d "../python-common/src" ]; then
                  PYTHONPATH_EXTRA="../python-common/src:../python-common/src/generated:"
                fi
                if [ -d "src/generated" ]; then
                  PYTHONPATH_EXTRA="${PYTHONPATH_EXTRA}src/generated:"
                fi

                set +e
                PYTHONPATH="${PYTHONPATH_EXTRA}src:." pytest tests/ \
                  --cov=src \
                  --cov-report=xml:coverage.xml \
                  --cov-report=term \
                  -q
                PYTEST_EXIT=$?
                set -e

                if [ $PYTEST_EXIT -ne 0 ]; then
                  echo "::warning::pytest exited with code $PYTEST_EXIT"
                fi

                deactivate

                if [ -f "coverage.xml" ]; then
                  echo "Coverage report generated successfully"
                else
                  echo "::warning::coverage.xml was not generated"
                fi
              fi
            fi

            if [ -f "go.mod" ]; then
              echo "Detected Go project"
              go test -coverprofile=coverage.out ./... || true
            fi

            if [ -f "package.json" ]; then
              echo "Detected Node.js project"
              if command -v pnpm &> /dev/null; then
                pnpm install --frozen-lockfile 2>/dev/null || true
                pnpm test --coverage 2>/dev/null || true
              fi
            fi
          '
        env:
          AWS_PROFILE: "nix"

      - name: Run SonarQube Scanner
        run: |
          { set +x; } 2>/dev/null
          nix develop ./nix#ci --command bash -c '
            set -e

            SERVICE_PATH="${{ matrix.service.path }}"
            PROJECT_KEY="${{ matrix.service.project_key }}"

            echo "Analyzing $PROJECT_KEY at $SERVICE_PATH"

            if [ -d "$SERVICE_PATH/src" ]; then
              SOURCES_PATH="src"
            else
              SOURCES_PATH="."
            fi

            SONAR_ARGS=(
              "-Dsonar.projectKey=$PROJECT_KEY"
              "-Dsonar.projectName=$PROJECT_KEY"
              "-Dsonar.projectBaseDir=$SERVICE_PATH"
              "-Dsonar.sources=$SOURCES_PATH"
              "-Dsonar.host.url=$SONAR_HOST_URL"
              "-Dsonar.token=$SONAR_TOKEN"
              "-Dsonar.qualitygate.wait=true"
              "-Dsonar.exclusions=**/.venv/**,**/node_modules/**,**/__pycache__/**,**/generated/**"
            )

            if [ -d "$SERVICE_PATH/tests" ]; then
              SONAR_ARGS+=("-Dsonar.tests=tests")
            fi

            if [ -f "$SERVICE_PATH/coverage.xml" ]; then
              echo "Found coverage report at $SERVICE_PATH/coverage.xml"
              SONAR_ARGS+=("-Dsonar.python.coverage.reportPaths=coverage.xml")
            else
              echo "::warning::No coverage report found at $SERVICE_PATH/coverage.xml"
            fi

            if [ -f "$SERVICE_PATH/go.mod" ]; then
              SONAR_ARGS+=("-Dsonar.go.coverage.reportPaths=coverage.out")
            fi

            for attempt in 1 2 3; do
              echo "SonarQube scan attempt $attempt/3"
              if sonar-scanner "${SONAR_ARGS[@]}"; then
                break
              fi
              if [ "$attempt" -lt 3 ]; then
                echo "::warning::Attempt $attempt failed, retrying in 15s..."
                sleep 15
              else
                echo "::error::All 3 attempts failed"
                exit 1
              fi
            done
          '
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          AWS_PROFILE: "nix"
