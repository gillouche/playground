# golangci-lint configuration for Go projects in apps/
run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  enable:
    - errcheck      # Check for unchecked errors
    - gosimple      # Simplify code
    - govet         # Go vet
    - ineffassign   # Detect ineffectual assignments
    - staticcheck   # Static analysis
    - unused        # Find unused code
    - gofmt         # Check formatting
    - goimports     # Check imports
    - misspell      # Find misspellings
    - unconvert     # Remove unnecessary conversions
    - unparam       # Find unused parameters
    - gocritic      # Opinionated linter
    - revive        # Fast, configurable linter
    - gosec         # Security checks
    - prealloc      # Find slice preallocation opportunities

linters-settings:
  govet:
    enable-all: true
    disable:
      - fieldalignment  # Too strict for most cases

  goimports:
    local-prefixes: github.com/gillouche/playground

  revive:
    rules:
      - name: blank-imports
      - name: context-as-argument
      - name: context-keys-type
      - name: dot-imports
      - name: error-return
      - name: error-strings
      - name: error-naming
      - name: exported
      - name: if-return
      - name: increment-decrement
      - name: var-naming
      - name: var-declaration
      - name: package-comments
      - name: range
      - name: receiver-naming
      - name: time-naming
      - name: unexported-return
      - name: indent-error-flow
      - name: errorf

  gosec:
    excludes:
      - G104  # Unhandled errors (too noisy)

issues:
  exclude-rules:
    # Exclude test files from some checks
    - path: _test\.go
      linters:
        - gosec
        - unparam

  max-issues-per-linter: 50
  max-same-issues: 10
