[project]
name = "{{SERVICE_NAME}}"
version = "0.1.0"
description = "{{SERVICE_DESCRIPTION}}"
requires-python = "==3.14.*"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP"]
ignore = ["E501"]
