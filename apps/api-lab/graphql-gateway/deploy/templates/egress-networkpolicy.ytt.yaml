#@ load("@ytt:data", "data")

#@ if data.values.env != "sandbox":
  apiVersion: networking.k8s.io/v1
  kind: NetworkPolicy
  metadata:
    name: allow-egress-graphql-gateway
  spec:
    podSelector:
      matchLabels:
        component: graphql-gateway
    policyTypes:
    - Egress
    egress:
      #! Allow DNS resolution
      - to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: kube-system
        ports:
          - protocol: UDP
            port: 53
          - protocol: TCP
            port: 53
      #! Allow access to python-api within same namespace
      - to:
          - podSelector:
              matchLabels:
                component: python-api
        ports:
          - protocol: TCP
            port: 8080
      #! Allow access to monitoring (Tempo)
      - to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: monitoring
        ports:
          - protocol: TCP
            port: 4317
          - protocol: TCP
            port: 4318
#@ end
