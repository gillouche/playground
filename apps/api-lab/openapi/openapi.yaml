openapi: 3.1.0
info:
  title: Library Book Management API
  version: 1.0.0
  description: API for managing library books, inventory, and reservations.

paths:
  /api/v1/books:
    get:
      summary: List books
      operationId: listBooks
      parameters:
        - name: available_only
          in: query
          schema:
            type: boolean
        - name: genre
          in: query
          schema:
            type: string
        - name: author
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of books
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BookResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      summary: Create a book
      operationId: createBook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookCreate"
      responses:
        "201":
          description: Book created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/books/{book_id}:
    get:
      summary: Get a book by ID
      operationId: getBook
      parameters:
        - name: book_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Book details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    put:
      summary: Update a book
      operationId: updateBook
      parameters:
        - name: book_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookUpdate"
      responses:
        "200":
          description: Book updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      summary: Delete a book
      operationId: deleteBook
      parameters:
        - name: book_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Book deleted
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/inventory:
    get:
      summary: Get inventory
      operationId: getInventory
      responses:
        "200":
          description: Inventory details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/reservations:
    post:
      summary: Create reservations
      operationId: createReservations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReservationCreate"
      responses:
        "201":
          description: Reservations created
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReservationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
    get:
      summary: List reservations
      operationId: listReservations
      parameters:
        - name: user_id
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: book_id
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of reservations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReservationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/reservations/{id}:
    get:
      summary: Get a reservation by ID
      operationId: getReservation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Reservation details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservationResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/reservations/{id}/return:
    post:
      summary: Return a reservation
      operationId: returnReservation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Reservation returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservationResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /healthz:
    get:
      summary: Health check
      operationId: healthCheck
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /ready:
    get:
      summary: Readiness check
      operationId: readinessCheck
      responses:
        "200":
          description: Service is ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /info:
    get:
      summary: Service info
      operationId: serviceInfo
      responses:
        "200":
          description: Service information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InfoResponse"

components:
  schemas:
    Book:
      type: object
      properties:
        id:
          type: string
          format: uuid
        isbn:
          type: string
        title:
          type: string
        author:
          type: string
        genre:
          type: string
        published_year:
          type: integer
        total_copies:
          type: integer
        available_copies:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - isbn
        - title
        - author
        - genre
        - published_year
        - total_copies
        - available_copies
        - created_at
        - updated_at

    BookCreate:
      type: object
      properties:
        isbn:
          type: string
        title:
          type: string
        author:
          type: string
        genre:
          type: string
        published_year:
          type: integer
        total_copies:
          type: integer
      required:
        - isbn
        - title
        - author
        - genre
        - published_year
        - total_copies

    BookUpdate:
      type: object
      properties:
        isbn:
          type: string
        title:
          type: string
        author:
          type: string
        genre:
          type: string
        published_year:
          type: integer
        total_copies:
          type: integer

    BookResponse:
      allOf:
        - $ref: "#/components/schemas/Book"

    Reservation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        book_id:
          type: string
          format: uuid
        user_id:
          type: string
        reserved_at:
          type: string
          format: date-time
        due_date:
          type: string
          format: date-time
        returned_at:
          type:
            - string
            - "null"
          format: date-time
        status:
          type: string
          enum:
            - ACTIVE
            - RETURNED
            - OVERDUE
      required:
        - id
        - book_id
        - user_id
        - reserved_at
        - due_date
        - status

    ReservationCreate:
      type: object
      properties:
        user_id:
          type: string
        book_ids:
          type: array
          items:
            type: string
            format: uuid
      required:
        - user_id
        - book_ids

    ReservationResponse:
      allOf:
        - $ref: "#/components/schemas/Reservation"

    InventoryResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Book"
      required:
        - items

    ErrorResponse:
      type: object
      properties:
        detail:
          type: string
        status_code:
          type: integer
      required:
        - detail
        - status_code

    HealthResponse:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    InfoResponse:
      type: object
      properties:
        hostname:
          type: string
        app_version:
          type: string
        environment:
          type: string
        app:
          type: string
        component:
          type: string
        node:
          type: string
        pod_ip:
          type: string
        log_level:
          type: string
        git_tag:
          type: string
        git_commit:
          type: string

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
