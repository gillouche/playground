apiVersion: v1
kind: ConfigMap
metadata:
  name: api-lab-dashboard
  labels:
    grafana_dashboard: "1"
    component: monitoring
data:
  api-lab-prod.json: |
    {
      "annotations": {"list": []},
      "editable": true,
      "panels": [
        {
          "title": "Requests Per Second (Total)",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "targets": [{"expr": "sum(rate(http_requests_total{app=\"api-lab\", component=~\"${service}\", environment=\"prod\"}[1m]))", "legendFormat": "Total RPS"}],
          "datasource": {"type": "prometheus", "uid": "${datasource}"}
        },
        {
          "title": "RPS by Status Code",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "targets": [{"expr": "sum by (status) (rate(http_requests_total{app=\"api-lab\", component=~\"${service}\", environment=\"prod\"}[1m]))", "legendFormat": "{{status}}"}],
          "datasource": {"type": "prometheus", "uid": "${datasource}"}
        },
        {
          "title": "Request Latency (P95/P99)",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
          "targets": [
            {"expr": "histogram_quantile(0.99, sum by (le) (rate(http_request_duration_seconds_bucket{app=\"api-lab\", component=~\"${service}\", environment=\"prod\"}[1m])))", "legendFormat": "P99"},
            {"expr": "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{app=\"api-lab\", component=~\"${service}\", environment=\"prod\"}[1m])))", "legendFormat": "P95"}
          ],
          "datasource": {"type": "prometheus", "uid": "${datasource}"}
        },
        {
          "title": "Error Rate",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
          "targets": [{"expr": "sum(rate(http_requests_total{status=~\"5..\", app=\"api-lab\", component=~\"${service}\", environment=\"prod\"}[1m])) / sum(rate(http_requests_total{app=\"api-lab\", component=~\"${service}\", environment=\"prod\"}[1m]))", "legendFormat": "Error Rate"}],
          "datasource": {"type": "prometheus", "uid": "${datasource}"}
        },
        {
          "title": "Cache Hit/Miss Ratio",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 16},
          "targets": [
            {"expr": "sum(rate(api_lab_cache_hits_total{environment=\"prod\"}[1m]))", "legendFormat": "Hits"},
            {"expr": "sum(rate(api_lab_cache_misses_total{environment=\"prod\"}[1m]))", "legendFormat": "Misses"}
          ],
          "datasource": {"type": "prometheus", "uid": "${datasource}"}
        },
        {
          "title": "DB Query Latency",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 16},
          "targets": [{"expr": "histogram_quantile(0.95, sum by (le) (rate(api_lab_db_query_duration_seconds_bucket{environment=\"prod\"}[1m])))", "legendFormat": "P95 DB Query"}],
          "datasource": {"type": "prometheus", "uid": "${datasource}"}
        },
        {
          "title": "Available Books",
          "type": "stat",
          "gridPos": {"h": 4, "w": 6, "x": 0, "y": 24},
          "targets": [{"expr": "api_lab_books_available{environment=\"prod\"}", "legendFormat": "Available Books"}],
          "datasource": {"type": "prometheus", "uid": "${datasource}"}
        },
        {
          "title": "Active Reservations",
          "type": "stat",
          "gridPos": {"h": 4, "w": 6, "x": 6, "y": 24},
          "targets": [{"expr": "api_lab_active_reservations{environment=\"prod\"}", "legendFormat": "Active Reservations"}],
          "datasource": {"type": "prometheus", "uid": "${datasource}"}
        }
      ],
      "refresh": "5s",
      "schemaVersion": 38,
      "tags": ["api-lab", "fastapi", "prometheus"],
      "templating": {
        "list": [
          {"name": "datasource", "type": "datasource", "query": "prometheus", "hide": 2},
          {"name": "service", "type": "query", "query": {"query": "label_values(http_requests_total{app=\"api-lab\", environment=\"prod\"}, component)"}, "refresh": 1, "sort": 1}
        ]
      },
      "time": {"from": "now-5m", "to": "now"},
      "title": "api-lab dashboard - prod",
      "uid": "api-lab-dashboard-prod"
    }
