apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: graphql-gateway
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
  labels:
    app: api-lab
    component: graphql-gateway
    environment: dev
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - graphql-gateway.api-lab.dev.k3s.gillouche.homelab
  rules:
  - host: graphql-gateway.api-lab.dev.k3s.gillouche.homelab
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: graphql-gateway
            port:
              number: 8083
