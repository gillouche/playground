apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: python-auth-api
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
  labels:
    app: api-lab
    component: python-auth-api
    environment: dev
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - python-auth-api.api-lab.dev.k3s.gillouche.homelab
  rules:
  - host: python-auth-api.api-lab.dev.k3s.gillouche.homelab
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: python-auth-api
            port:
              number: 8084
