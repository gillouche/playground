apiVersion: v1
kind: ConfigMap
metadata:
  name: python-api-config
  labels:
    component: python-api
data:
  ENVIRONMENT: sandbox
  APP: api-lab
  COMPONENT: python-api
  APP_VERSION: sandbox
  COMPONENT_VERSION: latest
  GIT_TAG: local/python-api/latest
  GIT_COMMIT: local
  LOG_LEVEL: DEBUG
  POSTGRES_HOST: postgres.playground-infra-sandbox.svc.cluster.local
  POSTGRES_PORT: "5432"
  POSTGRES_DB: api_lab
  POSTGRES_USER: api_lab
  REDIS_HOST: redis.playground-infra-sandbox.svc.cluster.local
  REDIS_PORT: "6379"
  GRPC_PORT: "50051"
  ENABLE_TRACING: "false"
  OTEL_EXPORTER_OTLP_ENDPOINT: http://localhost:4317
