apiVersion: apps/v1
kind: Deployment
metadata:
  name: ts-api
  labels:
    component: ts-api
    app: api-lab
    environment: sandbox
spec:
  replicas: 1
  selector:
    matchLabels:
      component: ts-api
  template:
    metadata:
      labels:
        component: ts-api
        app: api-lab
        environment: sandbox
    spec:
      containers:
        - name: ts-api
          image: nexus.gillouche.homelab/docker-hosted/api-lab/ts-api
          imagePullPolicy: Never
          envFrom:
            - configMapRef:
                name: ts-api-config
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              memory: 128Mi
              cpu: 50m
            limits:
              memory: 512Mi
              cpu: 200m
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
