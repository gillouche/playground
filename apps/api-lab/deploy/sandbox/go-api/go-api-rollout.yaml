apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-api
  labels:
    component: go-api
    app: api-lab
    environment: sandbox
spec:
  replicas: 1
  selector:
    matchLabels:
      component: go-api
  template:
    metadata:
      labels:
        component: go-api
        app: api-lab
        environment: sandbox
    spec:
      containers:
        - name: go-api
          image: nexus.gillouche.homelab/docker-hosted/api-lab/go-api
          imagePullPolicy: Never
          envFrom:
            - configMapRef:
                name: go-api-config
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 256Mi
              cpu: 200m
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
