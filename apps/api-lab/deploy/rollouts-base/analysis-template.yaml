apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: success-rate
spec:
  args:
    - name: service
  metrics:
    - name: success-rate
      interval: 30s
      successCondition: len(result) == 0 || result[0] >= 0.95
      failureLimit: 3
      provider:
        prometheus:
          address: http://monitoring-kube-prometheus-prometheus.monitoring:9090
          query: |
            sum(rate(http_requests_total{status=~"2..",component="{{args.service}}"}[2m]))
            /
            sum(rate(http_requests_total{component="{{args.service}}"}[2m]))
---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: error-rate
spec:
  args:
    - name: service
  metrics:
    - name: error-rate
      interval: 30s
      successCondition: len(result) == 0 || result[0] <= 0.05
      failureLimit: 3
      provider:
        prometheus:
          address: http://monitoring-kube-prometheus-prometheus.monitoring:9090
          query: |
            sum(rate(http_requests_total{status=~"5..",component="{{args.service}}"}[2m]))
            /
            sum(rate(http_requests_total{component="{{args.service}}"}[2m]))
