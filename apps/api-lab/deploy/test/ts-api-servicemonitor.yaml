apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ts-api
  labels:
    app: api-lab
    component: ts-api
    environment: test
    release: monitoring
spec:
  jobLabel: component
  selector:
    matchLabels:
      app: api-lab
      component: ts-api
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
  podTargetLabels:
    - app
    - component
    - environment
  namespaceSelector:
    matchNames:
      - playground-apps-test-api-lab
