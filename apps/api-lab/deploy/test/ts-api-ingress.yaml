apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ts-api
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
  labels:
    app: api-lab
    component: ts-api
    environment: test
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - ts-api.api-lab.test.k3s.gillouche.homelab
  rules:
    - host: ts-api.api-lab.test.k3s.gillouche.homelab
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ts-api
                port:
                  number: 8080
