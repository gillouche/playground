apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: ts-api
  labels:
    component: ts-api
    app: api-lab
    environment: test
spec:
  scaleTargetRef:
    apiVersion: argoproj.io/v1alpha1
    kind: Rollout
    name: ts-api
  minReplicaCount: 1
  maxReplicaCount: 1
  pollingInterval: 30
  cooldownPeriod: 300
  triggers:
    - type: cpu
      metricType: Utilization
      metadata:
        value: "50"
