apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: python-api
  labels:
    component: python-api
    app: api-lab
    environment: test
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      component: python-api
  strategy:
    canary:
      analysis:
        templates:
          - templateName: success-rate
          - templateName: error-rate
        args:
          - name: service
            value: python-api
      steps:
        - setWeight: 20
        - pause:
            duration: 30s
        - setWeight: 100
  template:
    metadata:
      labels:
        component: python-api
        app: api-lab
        environment: test
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 2000
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: topology.kubernetes.io/node-group
                    operator: In
                    values:
                      - rpi
      containers:
        - name: python-api
          image: nexus.gillouche.homelab/docker-hosted/api-lab/python-api
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          envFrom:
            - configMapRef:
                name: python-api-config
            - secretRef:
                name: python-api-credentials
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 50051
              name: grpc
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 1Gi
              cpu: 500m
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 10
      volumes:
        - name: tmp
          emptyDir: {}
