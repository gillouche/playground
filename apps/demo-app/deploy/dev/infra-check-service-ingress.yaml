apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: infra-check-service
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
  labels:
    app: demo-app
    component: infra-check-service
    environment: dev
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - infra-check-service.demo-app.dev.k3s.gillouche.homelab
  rules:
    - host: infra-check-service.demo-app.dev.gillouche.homelab
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: infra-check-service
                port:
                  number: 8080
