apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
patches:
  - path: greeting-service-configmap.yaml
  - path: infra-check-service-configmap.yaml
  - path: traffic-generator-patch.yaml
  - path: traffic-generator-service-configmap.yaml

resources:
  - ../base
  - ../rollouts-base
  - ../../greeting-service/deploy/base
  - greeting-service-ingress.yaml
  - greeting-service-rollout.yaml
  - greeting-service-servicemonitor.yaml
  - greeting-service-scaledobject.yaml
  - ../../traffic-generator-service/deploy/with-hpa
  - ../../infra-check-service/deploy/base
  - infra-check-service-egress-networkpolicy.yaml
  - infra-check-service-configmap.yaml
  - infra-check-service-ingress.yaml
  - infra-check-service-rollout.yaml
  - infra-check-service-servicemonitor.yaml
  - infra-check-service-scaledobject.yaml
  - infra-check-credentials.yaml
  - monitoring-grafana-dashboard.yaml

images:
  - name: nexus.gillouche.homelab/docker-hosted/demo-app/greeting-service
    newTag: c333c4d
  - name: nexus.gillouche.homelab/docker-hosted/demo-app/infra-check-service
    newTag: c333c4d

labels:
  - pairs:
      environment: dev
      app: demo-app
    includeSelectors: false
    includeTemplates: true

commonAnnotations:
  owner: gillouche
