apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: infra-check-service
  annotations:
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: infra-check.gillouche.homelab
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: infra-check-service
                port:
                  number: 8080
  tls:
    - hosts:
        - infra-check.gillouche.homelab
      secretName: homelab-tls
