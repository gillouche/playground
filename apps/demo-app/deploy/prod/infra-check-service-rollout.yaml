apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: infra-check-service
  labels:
    component: infra-check-service
    app: demo-app
    environment: prod
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      component: infra-check-service
  strategy:
    canary:
      steps:
      - setWeight: 20
      - pause: {}
      - setWeight: 100
  template:
    metadata:
      labels:
        component: infra-check-service
        app: demo-app
        environment: prod
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 2000
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/node-group
                operator: In
                values:
                - rpi
      containers:
      - name: infra-check-service
        image: nexus.gillouche.homelab/docker-hosted/demo-app/infra-check-service
        imagePullPolicy: IfNotPresent
        command:
        - /usr/local/bin/python
        args:
        - /app/src/main.py
        envFrom:
        - configMapRef:
            name: infra-check-service-config
        - secretRef:
            name: infra-check-credentials
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        ports:
        - containerPort: 8080
          name: http
        resources:
          requests:
            memory: 256Mi
            cpu: 100m
          limits:
            memory: 1Gi
            cpu: 500m
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
