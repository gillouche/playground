apiVersion: apps/v1
kind: Deployment
metadata:
  name: greeting-service
  labels:
    component: greeting-service
    app: demo-app
    environment: sandbox
spec:
  replicas: 1
  selector:
    matchLabels:
      component: greeting-service
  template:
    metadata:
      labels:
        component: greeting-service
        app: demo-app
        environment: sandbox
    spec:
      containers:
      - name: greeting-service
        image: nexus.gillouche.homelab/docker-hosted/demo-app/greeting-service
        imagePullPolicy: Never
        envFrom:
        - configMapRef:
            name: greeting-service-config
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        ports:
        - containerPort: 8080
          name: http
        resources:
          requests:
            memory: 256Mi
            cpu: 100m
          limits:
            memory: 512Mi
            cpu: 200m
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /healthz
            port: http
          failureThreshold: 30
          periodSeconds: 10
