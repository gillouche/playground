apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../infra-check-service/deploy/base
  - infra-check-service-rollout.yaml
  - infra-check-service-configmap.yaml
  - infra-check-secrets.yaml

images:
  - name: nexus.gillouche.homelab/docker-hosted/demo-app/infra-check-service
    newName: infra-check-service
    newTag: latest

labels:
  - pairs:
      environment: sandbox
      app: demo-app
    includeSelectors: false
    includeTemplates: true

commonAnnotations:
  owner: gillouche
