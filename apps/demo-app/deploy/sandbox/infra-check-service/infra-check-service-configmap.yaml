apiVersion: v1
kind: ConfigMap
metadata:
  name: infra-check-service-config
  labels:
    component: infra-check-service
data:
  ENVIRONMENT: sandbox
  APP: demo-app
  COMPONENT: infra-check-service
  APP_VERSION: sandbox
  COMPONENT_VERSION: latest
  GIT_TAG: local/infra-check-service/latest
  GIT_COMMIT: local
  LOG_LEVEL: INFO
  POSTGRES_HOST: postgres.playground-infra-sandbox.svc.cluster.local
  POSTGRES_PORT: "5432"
  POSTGRES_DB: playground
  POSTGRES_USER: playground
  REDIS_HOST: redis.playground-infra-sandbox.svc.cluster.local
  REDIS_PORT: "6379"
  KAFKA_BOOTSTRAP_SERVERS: kafka.playground-infra-sandbox.svc.cluster.local:9092
  KAFKA_TOPIC: infra-check
  MONGODB_HOST: mongodb.playground-infra-sandbox.svc.cluster.local
  MONGODB_PORT: "27017"
  MONGODB_DB: playground
  MONGODB_USER: playground
