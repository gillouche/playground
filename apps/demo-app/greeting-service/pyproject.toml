[project]
name = "demo-app"
version = "0.1.0"
description = "Demo App for Playground"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.128.0",
    "pydantic>=2.12.5",
    "pytest-asyncio>=1.3.0",
    "uvicorn>=0.40.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
]


[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "ruff>=0.14.13",
    "httpx",
    "pytest-pythonpath>=0.7.3",
    "pytest-cov>=7.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.uv]
