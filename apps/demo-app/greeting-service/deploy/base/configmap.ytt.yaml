#@ load("@ytt:data", "data")

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: #@ data.values.component + "-config"
  labels:
    app: #@ data.values.app
    component: #@ data.values.component
    environment: #@ data.values.env
data:
  ENVIRONMENT: #@ data.values.env
  APP: #@ data.values.app
  COMPONENT: #@ data.values.component
  #@ if data.values.env == "dev":
  LOG_LEVEL: "DEBUG"
  #@ else:
  LOG_LEVEL: "INFO"
  #@ end
