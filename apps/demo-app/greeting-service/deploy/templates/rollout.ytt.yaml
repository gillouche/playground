#@ load("@ytt:data", "data")

#@ if data.values.env == "sandbox":
apiVersion: apps/v1
kind: Deployment
#@ else:
apiVersion: argoproj.io/v1alpha1
kind: Rollout
#@ end
metadata:
  name: #@ data.values.component
  labels:
    component: #@ data.values.component
    app: #@ data.values.app
    environment: #@ data.values.env
spec:
  replicas: 1
  selector:
    matchLabels:
      component: #@ data.values.component
  #@ if data.values.env != "sandbox":
  strategy:
    canary:
      steps:
      - setWeight: 20
      - pause: {duration: 30s}
      - setWeight: 40
      - pause: {duration: 10s}
      - setWeight: 60
      - pause: {duration: 10s}
      - setWeight: 80
      - pause: {duration: 10s}
  #@ end
  template:
    metadata:
      labels:
        component: #@ data.values.component
        app: #@ data.values.app
        environment: #@ data.values.env
    spec:
      #@ if data.values.env != "sandbox":
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 2000
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/node-group
                operator: In
                values:
                - rpi
      #@ end
      containers:
      - name: #@ data.values.component
        image: nexus.gillouche.homelab/docker-hosted/demo-app/greeting-service
        #@ if data.values.env == "sandbox":
        imagePullPolicy: Never
        #@ end
        command: ["/usr/local/bin/python"]
        args: ["/app/src/main.py"]
        envFrom:
        - configMapRef:
            name: greeting-service-config
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        ports:
        - containerPort: 8080
          name: http
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
