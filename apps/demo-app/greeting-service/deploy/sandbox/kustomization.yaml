apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../base

# Override base image with local image for dev
images:
  - name: nexus.gillouche.homelab/docker-hosted/demo-app/greeting-service
    newName: greeting-service
    newTag: latest
patches:
  - path: patch-pull-policy.yaml
  - path: patches.yaml
  - path: greeting-service-configmap.yaml
