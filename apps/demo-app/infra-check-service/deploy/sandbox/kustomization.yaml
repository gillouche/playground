apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../base
  - kafka-external-name.yaml

images:
  - name: nexus.gillouche.homelab/docker-hosted/demo-app/infra-check-service
    newName: infra-check-service
    newTag: latest

patches:
  - path: patch-pull-policy.yaml
  - path: configmap.yaml

secretGenerator:
  - name: infra-check-secrets
    literals:
      - POSTGRES_PASSWORD=playground
      - REDIS_PASSWORD=playground
      - MONGODB_PASSWORD=playground
