description = "Traffic Generator for Demo App"
requires-python = "==3.13.*"
dependencies = [
    "httpx>=0.27.0",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp",
    "opentelemetry-instrumentation-httpx",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "ruff>=0.14.13",
]

[tool.uv]
