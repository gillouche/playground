apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-concept
  labels:
    app: demo-concept
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-concept
  template:
    metadata:
      labels:
        app: demo-concept
    spec:
      containers:
      - name: demo-concept
        image: nexus.home-cluster:8081/repository/docker-hosted/playground/demo-concept:latest
        imagePullPolicy: Always
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: demo-concept
spec:
  selector:
    app: demo-concept
  ports:
  - port: 80
    targetPort: 8080 # App doesn't really serve HTTP but standard specificaiton.
