apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-concept
  labels:
    app: demo-concept
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-concept
  template:
    metadata:
      labels:
        app: demo-concept
    spec:
      containers:
      - name: demo-concept
        image: demo-concept:latest
        ports:
        - containerPort: 8080
          name: http
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
