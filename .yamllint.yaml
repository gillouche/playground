# yamllint configuration
extends: default

rules:
  line-length:
    max: 120
    level: warning
  document-start: disable
  truthy:
    check-keys: false
  comments:
    min-spaces-from-content: 1
  braces:
    min-spaces-inside: 0
    max-spaces-inside: 1
  brackets:
    min-spaces-inside: 0
    max-spaces-inside: 0
  indentation:
    spaces: 2
    indent-sequences: consistent

ignore: |
  # Ignore generated files
  **/deploy/dev/
  **/deploy/test/
  **/deploy/prod/
  **/deploy/sandbox/
  # Ignore lock files
  pnpm-lock.yaml
